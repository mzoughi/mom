<!-- ════════ A11Y CONTROLLER ════════
Same API as the VDG example (init / toggle / narrate / col). Themes are layered over
the defaults (light / colour-blind, then high contrast on top) and set CSS variables on
the root, so the canvas, the torque cards and the control panels all change together.
-->
<script>
var bbA11y = (function(){
var ROOT = null;
var states = { hc:false, lm:false, cb:false, nr:true };
var DEFS = {'--bb-canvas':'#f1efe8','--bb-beam':'#888780','--bb-shine':'#d3d1c7','--bb-tick':'#5f5e5a','--bb-text':'#222222',
'--bb-pivot':'#378add','--bb-base':'#b4b2a9','--bb-m1':'#e24b4a','--bb-m2':'#993556','--bb-m3':'#185fa5','--bb-m4':'#0c447c',
'--bb-card':'#f8f8f8','--bb-cardline':'#cccccc','--bb-muted':'#555555','--bb-ok-bg':'#e8f5e9','--bb-ok-fg':'#1b5e20',
'--bb-warn-bg':'#fff8e1','--bb-warn-fg':'#a14d00','--bb-gbeam':'#e3f2fd','--bb-gleft':'#fce4ec','--bb-gright':'#e8f5e9',
'--bb-val-bg':'#1a3d8f','--bb-val-fg':'#ffeb3b','--bb-toolbar':'#222'};
var THEMES = {
hc:{'--bb-canvas':'#000000','--bb-beam':'#ffffff','--bb-shine':'#bbbbbb','--bb-tick':'#ffffff','--bb-text':'#ffffff',
'--bb-pivot':'#00e8d0','--bb-base':'#777777','--bb-m1':'#ff4444','--bb-m2':'#ff88cc','--bb-m3':'#44aaff','--bb-m4':'#88ccff',
'--bb-card':'#000000','--bb-cardline':'#ffffff','--bb-muted':'#dddddd','--bb-ok-bg':'#003300','--bb-ok-fg':'#66ff66',
'--bb-warn-bg':'#332200','--bb-warn-fg':'#ffcc00','--bb-val-bg':'#000000','--bb-val-fg':'#ffff00','--bb-toolbar':'#000'},
lm:{'--bb-canvas':'#fbfbf8','--bb-beam':'#6f6e68','--bb-shine':'#c8c6bc','--bb-tick':'#444444','--bb-text':'#000000',
'--bb-pivot':'#1f6fbf','--bb-base':'#a9a79e','--bb-card':'#ffffff','--bb-toolbar':'#444'},
cb:{'--bb-m1':'#d55e00','--bb-m2':'#e69f00','--bb-m3':'#0072b2','--bb-m4':'#56b4e9','--bb-pivot':'#009e73',
'--bb-ok-bg':'#e3f1fa','--bb-ok-fg':'#0072b2','--bb-warn-bg':'#fdf0e6','--bb-warn-fg':'#a64400'}
};
var cur = {};
function applyVars(){
if (!ROOT) return;
var p, order = ['lm','cb','hc'];
cur = {}; for (p in DEFS) cur[p] = DEFS[p];
for (var i=0; i<order.length; i++){ if (states[order[i]]){ var t = THEMES[order[i]]; for (p in t) cur[p] = t[p]; } }
for (p in cur) ROOT.style.setProperty(p, cur[p]);
}
function styleBtn(id,on){
var b=document.getElementById(id); if(!b)return;
b.style.background=on?'rgba(0,232,208,.12)':'#2a2e3a';
b.style.borderColor=on?'#00e8d0':'#404a60';
b.style.color=on?'#00e8d0':'#7a8aaa';
b.setAttribute('aria-pressed',on?'true':'false');
}
function apply(){
if (!ROOT) return;
applyVars();
var nb=document.getElementById('bbNarBar'); if (nb) nb.style.display=states.nr?'block':'none';
var btn=document.getElementById('bbBtnNR'); if (btn) btn.textContent='NARRATION: '+(states.nr?'ON':'OFF');
styleBtn('bbBtnNR',states.nr); styleBtn('bbBtnHC',states.hc);
styleBtn('bbBtnLM',states.lm); styleBtn('bbBtnCB',states.cb);
}
return {
init:function(){ ROOT=document.getElementById('bbRoot'); apply(); },
toggle:function(k){
states[k]=!states[k];
if(k==='hc'&&states.hc) states.lm=false;
if(k==='lm'&&states.lm) states.hc=false;
apply();
if (typeof bbSim !== 'undefined' && bbSim.refresh) bbSim.refresh();
},
narrate:function(msg){
if(!states.nr)return;
var nb=document.getElementById('bbNarBar'); if(nb) nb.textContent=msg;
},
col:function(prop){ return cur[prop] || DEFS[prop]; }
};
})();
</script>
<!-- ════════ SIMULATION ════════
Pattern: mirrors the VGG (Van de Graaff) example: var simObj = (function(){ ... return {...}; })();
Physics (torques about the pivot, distances in metres):
each hanging weight:  tau = F * d
uniform beam (weight W, length L, pivot a distance p from the left end, f = p/L):
left segment  has weight W*f      acting at f*L/2     from the pivot -> tau_L,beam = W*f^2*L/2
right segment has weight W*(1-f)  acting at (1-f)*L/2 from the pivot -> tau_R,beam = W*(1-f)^2*L/2
(their difference equals W times the distance from the pivot to the beam's centre)
balanced when |tau_L - tau_R| < 0.005 N*m; otherwise the heavier side tips.
-->
<script>
var bbSim = (function(){
var canvas, ctx;
var CSS_W = 623, CSS_H = 230, MARGIN = 24, DPR = window.devicePixelRatio || 1;
var TOL = 0.005;
var beam = { W:5, L:100, P:50 };
var m = { 1:{F:0,d:0}, 2:{F:0,d:0}, 3:{F:0,d:0}, 4:{F:0,d:0} };
var animAngle = 0, targetAngle = 0, rafId = null;
function el(id){ return document.getElementById(id); }
function setText(id, v){ var e = el(id); if (e) e.textContent = v; }
function c(k){ return bbA11y.col(k); }
function fmt(n){ return n.toFixed(2); }
function armCm(side){ return side === 'L' ? beam.P : beam.L - beam.P; }
function sideOf(i){ return i <= 2 ? 'L' : 'R'; }
function vals(){
var f = beam.P / beam.L, Lm = beam.L/100;
var bTL = beam.W * f * f * Lm / 2;
var bTR = beam.W * (1-f) * (1-f) * Lm / 2;
var t = {};
for (var i=1; i<=4; i++) t[i] = m[i].F * m[i].d / 100;
var tL = bTL + t[1] + t[2], tR = bTR + t[3] + t[4];
return { f:f, bTL:bTL, bTR:bTR, t:t, tL:tL, tR:tR, balanced: Math.abs(tL - tR) < TOL };
}
/* keep distance sliders inside the beam, and the pivot inside 10-90 % of the beam */
function syncLimits(){
var pe = el('bbBeamP');
var pMin = Math.round(0.1*beam.L), pMax = Math.round(0.9*beam.L);
if (pe){ pe.min = pMin; pe.max = pMax; }
beam.P = Math.max(pMin, Math.min(pMax, beam.P));
if (pe) pe.value = beam.P;
setText('bbBeamPVal', String(Math.round(beam.P)));
for (var i=1; i<=4; i++){
var arm = Math.floor(armCm(sideOf(i)));
var de = el('bbD' + i + '');
if (m[i].d > arm) m[i].d = arm;
if (de){ de.max = arm; de.value = m[i].d; }
setText('bbD' + i + 'Val', String(Math.round(m[i].d)));
}
}
function updateUI(){
var v = vals();
setText('bbLeftTotal',  fmt(v.tL) + ' N·m');
setText('bbRightTotal', fmt(v.tR) + ' N·m');
var lp = [], rp = [];
if (beam.W > 0){ lp.push('beam ' + fmt(v.bTL)); rp.push('beam ' + fmt(v.bTR)); }
for (var i=1; i<=4; i++){
if (m[i].F > 0){
var s = 'M' + i + ': ' + m[i].F.toFixed(1) + ' N × ' + fmt(m[i].d/100) + ' m';
(i <= 2 ? lp : rp).push(s);
}
}
setText('bbLeftEq',  lp.length ? lp.join(' + ') : '—');
setText('bbRightEq', rp.length ? rp.join(' + ') : '—');
var sb = el('bbStatus'), lc = el('bbLeftCard'), rc = el('bbRightCard');
if (v.balanced){
sb.textContent = '✓ Balanced: τL = τR = ' + fmt(v.tL) + ' N·m';
sb.style.background = c('--bb-ok-bg'); sb.style.color = c('--bb-ok-fg');
lc.className = 'bb_tcard bb_ok'; rc.className = 'bb_tcard bb_ok';
} else {
sb.textContent = 'Not balanced: the ' + (v.tL > v.tR ? 'left' : 'right') + ' side tips down (Δτ = ' + fmt(Math.abs(v.tL - v.tR)) + ' N·m)';
sb.style.background = c('--bb-warn-bg'); sb.style.color = c('--bb-warn-fg');
lc.className = 'bb_tcard'; rc.className = 'bb_tcard';
}
targetAngle = v.balanced ? 0 : Math.sign(v.tR - v.tL) * Math.min(Math.abs(v.tR - v.tL)/8, 0.2);
if (!rafId) animate();
}
/* rounded rectangle that also works where ctx.roundRect is missing */
function rr(x, y, w, h, r){
r = Math.min(r, w/2, h/2);
ctx.beginPath(); ctx.moveTo(x+r, y);
ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
function draw(){
if (!ctx) return;
var v = vals();
var usable = CSS_W - 2*MARGIN, pxPerCm = usable / beam.L;
var pivotX = MARGIN + v.f*usable, cy = CSS_H*0.32, bh = 10;
var leftPx = beam.P*pxPerCm, rightPx = (beam.L - beam.P)*pxPerCm;
var mc = [null, c('--bb-m1'), c('--bb-m2'), c('--bb-m3'), c('--bb-m4')];
ctx.clearRect(0, 0, CSS_W, CSS_H);
ctx.fillStyle = c('--bb-canvas'); ctx.fillRect(0, 0, CSS_W, CSS_H);
/* support stand (drawn first so the beam sits on top) */
var pivotH = 56;
ctx.fillStyle = c('--bb-beam');
ctx.beginPath();
ctx.moveTo(pivotX-10, cy+4); ctx.lineTo(pivotX+10, cy+4);
ctx.lineTo(pivotX+5, cy+pivotH); ctx.lineTo(pivotX-5, cy+pivotH); ctx.closePath(); ctx.fill();
ctx.fillStyle = c('--bb-base'); ctx.fillRect(pivotX-40, cy+pivotH, 80, 5);
ctx.save();
ctx.translate(pivotX, cy); ctx.rotate(animAngle);
ctx.fillStyle = c('--bb-beam'); rr(-leftPx, -bh/2, leftPx+rightPx, bh, 4); ctx.fill();
ctx.fillStyle = c('--bb-shine'); rr(-leftPx, -bh/2+1, leftPx+rightPx, 3, 2); ctx.fill();
/* centre-of-mass marker of the beam */
if (beam.W > 0){
var cmx = (beam.L/2 - beam.P)*pxPerCm;
ctx.strokeStyle = c('--bb-tick'); ctx.lineWidth = 1;
ctx.beginPath(); ctx.arc(cmx, 0, 4, 0, 2*Math.PI); ctx.stroke();
ctx.beginPath(); ctx.moveTo(cmx-4, 0); ctx.lineTo(cmx+4, 0); ctx.moveTo(cmx, -4); ctx.lineTo(cmx, 4); ctx.stroke();
}
ctx.fillStyle = c('--bb-pivot'); ctx.beginPath(); ctx.arc(0, 0, 5, 0, 2*Math.PI); ctx.fill();
/* ruler ticks, labelled in cm from the left end */
var cands = [2,5,10,20,25,50];
var step = cands.filter(function(s){ return s*pxPerCm >= 22; })[0] || 50;
ctx.strokeStyle = c('--bb-tick'); ctx.fillStyle = c('--bb-tick'); ctx.lineWidth = 1;
ctx.font = '9px Calibri, Arial, sans-serif'; ctx.textAlign = 'center';
for (var cm=0; cm<=beam.L+0.001; cm+=step){
var tx = (cm - beam.P)*pxPerCm, major = (Math.round(cm/step) % 2 === 0) || step >= 20, th = major ? 7 : 4;
ctx.beginPath(); ctx.moveTo(tx, -bh/2-th); ctx.lineTo(tx, -bh/2); ctx.stroke();
if (major) ctx.fillText(String(Math.round(cm)), tx, -bh/2-th-3);
}
ctx.restore();
/* hanging weights: strings stay vertical while the beam tilts; one block per 2 N */
var ca = Math.cos(animAngle), sa = Math.sin(animAngle);
for (var i=1; i<=4; i++){
if (m[i].F <= 0) continue;
var x = (i <= 2 ? -1 : 1) * m[i].d * pxPerCm;
var ax = pivotX + x*ca - (bh/2)*sa, ay = cy + x*sa + (bh/2)*ca;   /* hook point under the beam */
var blocks = Math.max(1, Math.round(m[i].F/2)), bw = 14, bh2 = 9;
ctx.strokeStyle = mc[i]; ctx.lineWidth = 1.5;
ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax, ay+5); ctx.stroke();
for (var b=0; b<blocks; b++){
ctx.fillStyle = mc[i]; rr(ax-bw/2, ay+5+b*(bh2+2), bw, bh2, 2); ctx.fill();
ctx.strokeStyle = c('--bb-text'); ctx.lineWidth = 0.6; ctx.stroke();
}
var ly = ay + 5 + blocks*(bh2+2) + 11;
ctx.fillStyle = c('--bb-text'); ctx.textAlign = 'center';
ctx.font = 'bold 10px Calibri, Arial, sans-serif'; ctx.fillText('M' + i, ax, ly);
ctx.font = '10px Calibri, Arial, sans-serif'; ctx.fillText(m[i].F.toFixed(1) + ' N', ax, ly + 11);
}
/* legend */
ctx.fillStyle = c('--bb-text'); ctx.font = '10px Calibri, Arial, sans-serif'; ctx.textAlign = 'left';
ctx.fillText('Ruler marks: cm from the left end.   ⊕ beam centre of mass   ● pivot', 8, CSS_H - 8);
}
function animate(){
var d = targetAngle - animAngle;
if (Math.abs(d) > 0.001){ animAngle += d*0.08; draw(); rafId = requestAnimationFrame(animate); }
else { animAngle = targetAngle; draw(); rafId = null; }
}
function describe(){
var v = vals();
var msg = 'Beam ' + beam.L + ' cm long, weight ' + beam.W.toFixed(1) + ' N, pivot ' + Math.round(beam.P) + ' cm from the left end. ';
var any = false;
for (var i=1; i<=4; i++){
if (m[i].F > 0){ any = true; msg += 'M' + i + ': ' + m[i].F.toFixed(1) + ' N, ' + Math.round(m[i].d) + ' cm ' + (i <= 2 ? 'left' : 'right') + ' of the pivot. '; }
}
if (!any) msg += 'No weights are hanging. ';
msg += 'Left torque ' + fmt(v.tL) + ' N·m, right torque ' + fmt(v.tR) + ' N·m. ';
msg += v.balanced ? 'The beam is balanced.' : 'The ' + (v.tL > v.tR ? 'left' : 'right') + ' side tips down; the difference is ' + fmt(Math.abs(v.tL - v.tR)) + ' N·m.';
bbA11y.narrate(msg);
}
/* ── public ── */
function setBeam(k, val, quiet){
beam[k] = parseFloat(val);
if (k === 'W') setText('bbBeamWVal', beam.W.toFixed(1));
if (k === 'L') setText('bbBeamLVal', String(Math.round(beam.L)));
syncLimits(); updateUI();
if (!quiet) describe();
}
function setMass(i, k, val, quiet){
m[i][k] = parseFloat(val);
if (k === 'F') setText('bbF' + i + 'Val', m[i].F.toFixed(1));
syncLimits(); updateUI();
if (!quiet) describe();
}
function clearMasses(){
for (var i=1; i<=4; i++){
m[i].F = 0; m[i].d = 0;
var fe = el('bbF' + i + ''); if (fe) fe.value = 0;
setText('bbF' + i + 'Val', '0.0');
}
syncLimits(); updateUI();
describe();
}
function rst(){
beam = { W:5, L:100, P:50 };
var w = el('bbBeamW'), l = el('bbBeamL');
if (w) w.value = 5; if (l) l.value = 100;
setText('bbBeamWVal', '5.0'); setText('bbBeamLVal', '100');
for (var i=1; i<=4; i++){ m[i].F = 0; m[i].d = 0; var fe = el('bbF' + i + ''); if (fe) fe.value = 0; setText('bbF' + i + 'Val', '0.0'); }
animAngle = 0;
syncLimits(); updateUI();
bbA11y.narrate('Ready. A 100 cm beam weighing 5 N rests on a pivot at its centre. Use the sliders to hang weights on each side; the torques update as you go.');
}
function refresh(){ updateUI(); draw(); }
/* boot (deferred one tick, as in the original, so the canvas exists) */
window.setTimeout(function(){
canvas = el('bbCanvas'); if (!canvas) return;
ctx = canvas.getContext('2d');
canvas.width = CSS_W*DPR; canvas.height = CSS_H*DPR;
canvas.style.width = CSS_W + 'px'; canvas.style.height = CSS_H + 'px';
ctx.scale(DPR, DPR);
rst();
}, 0);
return { setBeam:setBeam, setMass:setMass, clearMasses:clearMasses, describe:describe, rst:rst, refresh:refresh, draw:draw };
})();
bbA11y.init();
</script>
</main>
