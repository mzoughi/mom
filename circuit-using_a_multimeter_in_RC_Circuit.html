<!--
============================================================
MULTIMETER + CIRCUIT LAB WIDGET (MOM-compatible)
============================================================
A combined widget showing a digital multimeter on the left and a
teaching circuit on the right. Students use the multimeter to take
measurements of circuit components and learn proper measurement
technique.
Template variables:
0914 : MOM instance id
$R1    : R1 resistance in ohms (e.g., 1000)
$R2    : R2 resistance in ohms (e.g., 2000)
$C     : C capacitance in farads (e.g., 1e-6)
$color : LCD on-segment colour ('#222' for LCD, '#c33' for red LED)
$bg    : LCD background ('#a8b89a' classic, '#1a1a1a' LED black)
----- Circuit topology -----
Two loops sharing the C branch. Three branches between rails A and B:
Branch 1 (source): A -- seg1 wire -- R1 -- Vs -- B
Branch 2:           A -- seg2 wire -- R2 -- B
Branch 3:           A -- seg3 wire -- C  -- B
----- Component values -----
R1, R2, C values are passed in via template vars. They are NOT
displayed in the UI. Students must measure to discover them.
----- User-controllable circuit elements -----
* Source type: AC or DC (radio)
* Source voltage and (for AC) frequency (number inputs)
* Each branch wire seg1/seg2/seg3: present or removed (checkbox).
Remove to insert the ammeter for current measurements.
* Each component lead: connected or disconnected (8 checkboxes).
Disconnect a lead to isolate the component for resistance or
capacitance measurement.
----- Probes -----
Two ways to connect probes:
1. Click a "test point" (small grey dot on the schematic)
2. Use the dropdowns next to the probe labels (accessibility)
The "arm" button selects which probe (red or black) responds to
schematic clicks.
----- Measurement physics -----
* Voltage modes: read V across the two probe nodes.
DC mode + AC source = 0 (AC-coupled). AC mode + DC source = 0.
* Current modes: meter must be inserted in series. Remove a wire
segment and place both probes on the gap.
* Resistance / Capacitance: component must be ISOLATED (at least
one of its leads disconnected from the rest of the circuit).
If not isolated, the meter shows the parallel combination of the
component with the rest of the circuit AND a warning hint.
* Active jacks (COM + V/Ω/F or mA or 10A) are highlighted on the
meter based on the dial position to teach proper jack selection.
----- Accessibility -----
* Same a11y pattern as the standalone multimeter and digital scale:
light mode, narration bar, high contrast, font size cycling.
* Probe positions and meter readings narrated on every change.
* Pronounceable dial descriptions ("DC voltage, 20 volts range").
* Both click-to-set probe and dropdown probe selectors.
* Focus preserved across re-renders so keyboard users can interact
smoothly with the slider, checkboxes, and dropdowns.
============================================================
$value=199.9;
$dial="F/20u";
$color="yellow"; 
$bg='#a8b89a';
$R1=200;
$R2=100;
$C=66E-6;
$V=150;
-->
<div id="mmc_root0914" style="display:inline-block"></div>
<script>
(function(){
var thisq  = '0914';
var R1val  = (200);
var R2val  = (100);
var Cval   = (66E-6);
var Vval   = (150);
var color  = 'yellow';
var bg     = '#a8b89a';
var rootId = 'mmc_root0914';
/* ============================================================
 STATE
============================================================ */
var stateKey = 'mmcState_' + thisq;
if (!window[stateKey]) {
window[stateKey] = {
dial: 'off',
circuit: {
source: { type:'DC', V:Vval, freq:1000 },
R1: R1val, R2: R2val, C: Cval,
wires: { seg1:true, seg2:true, seg3:true },
leads: { R1:{l:true,r:true}, R2:{l:true,r:true}, C:{l:true,r:true}, Vs:{l:true,r:true} }
},
probes: { red:null, black:null },
activeProbe: 'red',
/* Fuse state:
mA jack is fused at 200 mA.
10A jack is NOT fused but its internal shunt can be damaged
if you exceed 10A. We treat damage the same as a blown fuse:
the input is "open" until the user resets.
 A short-lived `fuseJustBlew` timestamp triggers a one-shot flash
 animation in the SVG. */
fuseBlown: { mA:false, '10A':false },
fuseJustBlew: null,
a11y: { lightMode:false, narration:true, highContrast:false, fontSize:'normal' },
lastNarration: '',
hasShownIntro: false
};
}
var state = window[stateKey];
/* ============================================================
 COMPLEX MATH
============================================================ */
var cx = function(re,im){return{re:re,im:im||0}};
var cAdd = function(a,b){return cx(a.re+b.re,a.im+b.im)};
var cSub = function(a,b){return cx(a.re-b.re,a.im-b.im)};
var cMul = function(a,b){return cx(a.re*b.re-a.im*b.im,a.re*b.im+a.im*b.re)};
var cDiv = function(a,b){var d=b.re*b.re+b.im*b.im;return cx((a.re*b.re+a.im*b.im)/d,(a.im*b.re-a.re*b.im)/d)};
var cAbs = function(a){return Math.sqrt(a.re*a.re+a.im*a.im)};
var cPar = function(a,b){var s=cAdd(a,b);if(cAbs(s)<1e-30)return cx(Infinity,0);return cDiv(cMul(a,b),s)};
var zResistor = function(R){return cx(R,0)};
var zCapacitor = function(C,om){if(om<1e-12||C<1e-30)return cx(1e15,0);return cx(0,-1/(om*C))};
/* ============================================================
 SOLVE & MEASURE (from tested module)
============================================================ */
var solveCircuit = function(st){
var omega=(st.source.type==='AC')?2*Math.PI*st.source.freq:0;
var Vs=cx(st.source.V,0);
var b1=st.leads.Vs.l&&st.leads.Vs.r&&st.leads.R1.l&&st.leads.R1.r&&st.wires.seg1;
var b2=st.leads.R2.l&&st.leads.R2.r&&st.wires.seg2;
var b3=st.leads.C.l&&st.leads.C.r&&st.wires.seg3;
var z_R1=zResistor(st.R1),z_R2=zResistor(st.R2),z_C=zCapacitor(st.C,omega);
if(!b1)return{Vs:Vs,omega:omega,z_R1:z_R1,z_R2:z_R2,z_C:z_C,I_source:cx(0,0),I_R2:cx(0,0),I_C:cx(0,0),V_AB:cx(0,0),b1live:false,b2live:b2,b3live:b3};
var z_inner=(b2&&b3)?cPar(z_R2,z_C):(b2?z_R2:(b3?z_C:cx(1e15,0)));
var I_s=cDiv(Vs,cAdd(z_R1,z_inner));
var V_AB=cMul(I_s,z_inner);
var I_R2=b2?cDiv(V_AB,z_R2):cx(0,0);
var I_C=b3?cDiv(V_AB,z_C):cx(0,0);
return{Vs:Vs,omega:omega,z_R1:z_R1,z_R2:z_R2,z_C:z_C,I_source:I_s,I_R2:I_R2,I_C:I_C,V_AB:V_AB,b1live:b1,b2live:b2,b3live:b3};
};
var allNodes=['node_A','node_B','R1_left','R1_right','R2_left','R2_right','C_left','C_right','Vs_pos','Vs_neg','seg1_top','seg1_bot','seg2_top','seg2_bot','seg3_top','seg3_bot'];
var buildNodeMap=function(wires,leads){
var parent={};
for(var i=0;i<allNodes.length;i++)parent[allNodes[i]]=allNodes[i];
var find=function(x){while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x]}return x};
var union=function(a,b){var ra=find(a),rb=find(b);if(ra!==rb)parent[ra]=rb};
union('seg1_top','node_A');
if(leads.R1.l)union('seg1_bot','R1_left');
if(wires.seg1)union('seg1_top','seg1_bot');
union('seg2_top','node_A');
if(leads.R2.l)union('seg2_bot','R2_left');
if(wires.seg2)union('seg2_top','seg2_bot');
union('seg3_top','node_A');
if(leads.C.l)union('seg3_bot','C_left');
if(wires.seg3)union('seg3_top','seg3_bot');
if(leads.R1.r&&leads.Vs.l)union('R1_right','Vs_pos');
if(leads.R2.r)union('R2_right','node_B');
if(leads.C.r)union('C_right','node_B');
if(leads.Vs.r)union('Vs_neg','node_B');
return{find:find,sameNode:function(a,b){return find(a)===find(b)},findRoot:function(a){return find(a)}};
};
var computeNodeVoltages=function(st){
var sol=solveCircuit(st);
var nm=buildNodeMap(st.wires,st.leads);
var V_A=sol.V_AB,V_B=cx(0,0);
var Vs=cx(st.source.V,0);
var out={};
var nA=nm.findRoot('node_A'),nB=nm.findRoot('node_B');
for(var i=0;i<allNodes.length;i++){
var n=allNodes[i],r=nm.findRoot(n);
if(r===nA)out[n]=V_A;else if(r===nB)out[n]=V_B;else out[n]=null;
}
/* Source branch fill-in */
if(out['Vs_pos']===null && out['Vs_neg']!==null)out['Vs_pos']=cAdd(out['Vs_neg'],Vs);
if(out['R1_right']===null){
if(st.leads.R1.r&&st.leads.Vs.l&&out['Vs_pos']!==null)out['R1_right']=out['Vs_pos'];
}
if(out['R1_left']===null && out['R1_right']!==null){
if(sol.b1live)out['R1_left']=cAdd(out['R1_right'],cMul(sol.I_source,zResistor(st.R1)));
else out['R1_left']=out['R1_right'];
}
if(out['seg1_bot']===null && out['R1_left']!==null && st.leads.R1.l)out['seg1_bot']=out['R1_left'];
if(out['R2_right']===null && st.leads.R2.r)out['R2_right']=V_B;
if(out['R2_left']===null && out['R2_right']!==null)out['R2_left']=out['R2_right'];
if(out['seg2_bot']===null && out['R2_left']!==null && st.leads.R2.l)out['seg2_bot']=out['R2_left'];
if(out['C_right']===null && st.leads.C.r)out['C_right']=V_B;
if(out['C_left']===null && out['C_right']!==null)out['C_left']=out['C_right'];
if(out['seg3_bot']===null && out['C_left']!==null && st.leads.C.l)out['seg3_bot']=out['C_left'];
return out;
};
var isComponentIsolated=function(st,name){
var nm=buildNodeMap(st.wires,st.leads);
var nA=nm.findRoot('node_A'),nB=nm.findRoot('node_B');
if(name==='R2'){
var lLive=(nm.findRoot('R2_left')===nA),rLive=(nm.findRoot('R2_right')===nB);
return !(lLive&&rLive);
}
if(name==='C'){
var lLive=(nm.findRoot('C_left')===nA),rLive=(nm.findRoot('C_right')===nB);
return !(lLive&&rLive);
}
if(name==='R1'){
if(nm.findRoot('R1_left')!==nA)return true;
if(!st.leads.R1.r||!st.leads.Vs.l||!st.leads.Vs.r)return true;
var b2=st.leads.R2.l&&st.leads.R2.r&&st.wires.seg2;
var b3=st.leads.C.l&&st.leads.C.r&&st.wires.seg3;
if(!b2&&!b3)return true;
return false;
}
return true;
};
var measureCircuit=function(st,dial,redP,blkP){
var nm=buildNodeMap(st.wires,st.leads);
var V=computeNodeVoltages(st);
var result={value:0,warning:null,valid:true};
var mode='off';
if(dial.indexOf('V=/')===0)mode='V_DC';
else if(dial.indexOf('V~/')===0)mode='V_AC';
else if(dial.indexOf('Ohm/')===0)mode='OHM';
else if(dial.indexOf('F/')===0)mode='F';
else if(dial.indexOf('A=/')===0)mode='A_DC';
else if(dial.indexOf('A~/')===0)mode='A_AC';
else if(dial==='diode')mode='DIODE';
if(mode==='off'){result.valid=false;return result}
var isAmmeter=(mode==='A_DC'||mode==='A_AC');
if(!isAmmeter && (!redP||!blkP)){result.warning='Connect both probes.';return result}
if(mode==='V_DC'||mode==='V_AC'){
var vR=V[redP],vB=V[blkP];
if(vR===null||vB===null){result.warning='One or both probes not connected to the circuit.';return result}
var v=cSub(vR,vB);
if(mode==='V_DC')result.value=(st.source.type==='AC')?0:v.re;
else result.value=(st.source.type==='DC')?0:cAbs(v);
return result;
}
if(isAmmeter){
/* Determine which jack the red probe plugs into (mA or 10A) */
var jacksForDial = getActiveJacks(dial);
var jackUsed = null;
for (var jj = 0; jj < jacksForDial.length; jj++) {
if (jacksForDial[jj] !== 'COM') { jackUsed = jacksForDial[jj]; break; }
}
/* If the relevant input is already blown/damaged, OL with persistent warning. */
if (jackUsed && state.fuseBlown[jackUsed]) {
result.value = 1e9;   /* forces OL display */
result.warning = (jackUsed === 'mA')
? 'mA fuse is BLOWN. Press "Replace fuse" to repair, then re-measure.'
: '10A input damaged. Press "Replace fuse" to repair, then re-measure.';
result.fuseBlown = true;
return result;
}
var br=-1;
for(var b=1;b<=3;b++){
if(!st.wires['seg'+b]){
var t='seg'+b+'_top',bt='seg'+b+'_bot';
if(redP&&blkP){
var rt=nm.sameNode(redP,t),rb=nm.sameNode(redP,bt);
var blt=nm.sameNode(blkP,t),blb=nm.sameNode(blkP,bt);
if((rt&&blb)||(rb&&blt)){br=b;break}
}
}
}
if(br===-1){result.warning='To measure current, remove a branch wire and bridge the gap with the meter probes.';return result}
var st2=JSON.parse(JSON.stringify(st));
st2.wires['seg'+br]=true;
var s2=solveCircuit(st2);
var I=(br===1)?s2.I_source:(br===2?s2.I_R2:s2.I_C);
var Imag = cAbs(I);   /* magnitude in amps, regardless of AC/DC */
/* Fuse / damage check.
mA jack rated 200 mA = 0.2 A (fused).
10A jack rated 10 A (unfused but internal damage threshold). */
var rating = (jackUsed === 'mA') ? 0.2 : (jackUsed === '10A' ? 10.0 : null);
if (rating !== null && Imag > rating) {
state.fuseBlown[jackUsed] = true;
state.fuseJustBlew = jackUsed;   /* triggers one-shot flash animation */
result.value = 1e9;   /* OL */
result.warning = (jackUsed === 'mA')
? '⚡ FUSE BLOWN! Current of ' + (Imag*1000).toFixed(0) + ' mA exceeded the 200 mA fuse rating. The mA input is now open. Press "Replace fuse" and choose a higher-current jack (10 A).'
: '⚡ INPUT DAMAGED! Current of ' + Imag.toFixed(2) + ' A exceeded the 10 A maximum. Press "Replace fuse" to repair.';
result.fuseBlown = true;
return result;
}
if(mode==='A_DC')result.value=(st.source.type==='AC')?0:I.re;
else result.value=(st.source.type==='DC')?0:Imag;
return result;
}
if(mode==='OHM'||mode==='F'){
var omega2=(mode==='F')?2*Math.PI*1000:0;   /* OHM uses DC test signal so C is open; F uses 1kHz */
var components=[
{name:'R1',l:'R1_left',r:'R1_right',val:st.R1,kind:'R'},
{name:'R2',l:'R2_left',r:'R2_right',val:st.R2,kind:'R'},
{name:'C', l:'C_left', r:'C_right', val:st.C, kind:'C'}
];
var compFound=null;
for(var ci=0;ci<components.length;ci++){
var c=components[ci];
var rL=nm.sameNode(redP,c.l),rR=nm.sameNode(redP,c.r);
var blL=nm.sameNode(blkP,c.l),blR=nm.sameNode(blkP,c.r);
if((rL&&blR)||(rR&&blL)){compFound=c;break}
}
if(!compFound){result.warning='Probes do not span a single component.';return result}
var isolated=isComponentIsolated(st,compFound.name);
if(mode==='OHM'){
if(isolated){result.value=compFound.val;return result}
var paths=[];
if(compFound.name==='R2'){
if(st.leads.R1.l&&st.leads.R1.r&&st.wires.seg1&&st.leads.Vs.l&&st.leads.Vs.r)paths.push(zResistor(st.R1));
if(st.leads.C.l&&st.leads.C.r&&st.wires.seg3)paths.push(zCapacitor(st.C,omega2));
}else if(compFound.name==='R1'){
var p2=[];
if(st.leads.R2.l&&st.leads.R2.r&&st.wires.seg2)p2.push(zResistor(st.R2));
if(st.leads.C.l&&st.leads.C.r&&st.wires.seg3)p2.push(zCapacitor(st.C,omega2));
if(p2.length&&st.leads.Vs.l&&st.leads.Vs.r){
var pp=p2[0];for(var i=1;i<p2.length;i++)pp=cPar(pp,p2[i]);
paths.push(pp);
}
}else if(compFound.name==='C'){
if(st.leads.R1.l&&st.leads.R1.r&&st.wires.seg1&&st.leads.Vs.l&&st.leads.Vs.r)paths.push(zResistor(st.R1));
if(st.leads.R2.l&&st.leads.R2.r&&st.wires.seg2)paths.push(zResistor(st.R2));
}
var altPath=cx(1e15,0);
if(paths.length){altPath=paths[0];for(var i=1;i<paths.length;i++)altPath=cPar(altPath,paths[i])}
var totalZ=cPar(zResistor(compFound.val),altPath);
result.value=totalZ.re;
result.warning='Component not isolated. Disconnect at least one of its leads for an accurate reading.';
return result;
}else{
if(isolated){result.value=(compFound.kind==='C')?compFound.val:0}
else{result.value=0;result.warning='Component not isolated for capacitance reading.'}
return result;
}
}
if(mode==='DIODE'){result.value=0;result.warning='No diode in this circuit.';return result}
return result;
};
/* ============================================================
 DIAL POSITIONS (from multimeter v6)
============================================================ */
var positions = [
{ k:'Ohm/2M',a:5,label:'2M',group:'Ohm' },{ k:'Ohm/20M',a:15,label:'20M',group:'Ohm' },
{ k:'Ohm/200M',a:25,label:'200M',group:'Ohm' },
{ k:'V=/200m',a:40,label:'200m',group:'V=',groupStart:true },{ k:'V=/2',a:50,label:'2',group:'V=' },
{ k:'V=/20',a:60,label:'20',group:'V=' },{ k:'V=/200',a:70,label:'200',group:'V=' },
{ k:'V=/1000',a:80,label:'1000',group:'V=' },
{ k:'V~/700',a:90,label:'700',group:'V~',groupStart:true },{ k:'V~/200',a:105,label:'200',group:'V~' },
{ k:'V~/20',a:115,label:'20',group:'V~' },{ k:'V~/2',a:125,label:'2',group:'V~' },
{ k:'F/2p',a:140,label:'2p',group:'F',groupStart:true },{ k:'F/2n',a:150,label:'2n',group:'F' },
{ k:'F/20n',a:160,label:'20n',group:'F' },{ k:'F/200n',a:170,label:'200n',group:'F' },
{ k:'F/2u',a:-180,label:'2\u00B5',group:'F' },{ k:'F/20u',a:-170,label:'20\u00B5',group:'F' },
{ k:'F/200u',a:-160,label:'200\u00B5',group:'F' },
{ k:'A~/2m',a:-150,label:'2m',group:'A~',groupStart:true },{ k:'A~/20m',a:-140,label:'20m',group:'A~' },
{ k:'A~/200mA',a:-125,label:'200m',group:'A~' },{ k:'A~/10',a:-115,label:'10',group:'A~' },
{ k:'A=/10',a:-100,label:'10',group:'A=',groupStart:true },{ k:'A=/200m',a:-85,label:'200m',group:'A=' },
{ k:'A=/20m',a:-70,label:'20m',group:'A=' },{ k:'A=/2m',a:-55,label:'2m',group:'A=' },
{ k:'diode',a:-45,label:'\u25B6|',group:'diode',groupStart:true },
{ k:'Ohm/200',a:-35,label:'200',group:'Ohm',groupStart:true },{ k:'Ohm/2k',a:-25,label:'2k',group:'Ohm' },
{ k:'Ohm/20k',a:-15,label:'20k',group:'Ohm' },{ k:'Ohm/200k',a:-5,label:'200k',group:'Ohm' }
];
var dialMap={'off':0};
for(var ipi=0;ipi<positions.length;ipi++)dialMap[positions[ipi].k]=positions[ipi].a;
var getActiveJacks=function(d){
if(d==='off'||!d)return[];
if(d.indexOf('Ohm/')===0)return['COM','VOF'];
if(d.indexOf('V=/')===0)return['COM','VOF'];
if(d.indexOf('V~/')===0)return['COM','VOF'];
if(d.indexOf('F/')===0)return['COM','VOF'];
if(d==='diode')return['COM','VOF'];
if(d==='A=/10'||d==='A~/10')return['COM','10A'];
if(d.indexOf('A=/')===0)return['COM','mA'];
if(d.indexOf('A~/')===0)return['COM','mA'];
return[];
};
var dialToSpoken=function(d){
if(d==='off')return'Off';
if(d==='diode')return'Diode test';
var slash=d.indexOf('/');
if(slash===-1)return d;
var grp=d.substring(0,slash),rng=d.substring(slash+1);
var grpName={'Ohm':'Resistance','V=':'DC voltage','V~':'AC voltage','F':'Capacitance','A=':'DC current','A~':'AC current'}[grp]||grp;
var unit={'Ohm':'ohm','V=':'volt','V~':'volt','F':'farad','A=':'amp','A~':'amp'}[grp]||'';
var num=rng,prefix='',lc=rng.charAt(rng.length-1);
if(rng.length>=2&&rng.substring(rng.length-2)==='mA'){prefix='milli';unit='amp';num=rng.substring(0,rng.length-2)}
else if(lc==='M'){prefix='mega';num=rng.substring(0,rng.length-1)}
else if(lc==='k'){prefix='kilo';num=rng.substring(0,rng.length-1)}
else if(lc==='m'){prefix='milli';num=rng.substring(0,rng.length-1)}
else if(lc==='u'||lc==='\u00B5'){prefix='micro';num=rng.substring(0,rng.length-1)}
else if(lc==='n'){prefix='nano';num=rng.substring(0,rng.length-1)}
else if(lc==='p'){prefix='pico';num=rng.substring(0,rng.length-1)}
var unitOut=(num==='1')?unit:unit+'s';
return grpName+', '+num+' '+prefix+unitOut+' range';
};
/* ============================================================
 DISPLAY VALUE: based on dial range, format to 4 digits with decimals
 positioned correctly. The raw value from measureCircuit is in SI base units.
 Convert based on the range suffix.
============================================================ */
var rangeMultiplier=function(d){
if(d==='off')return 1;
if(d==='diode')return 1;

narrate(which+' probe set to '+(val ? val.replace(/_/g,' ') : 'none'));
render();
};
window['mmcArmProbe_'+thisq] = function(which){
state.activeProbe = which;
narrate(which+' probe armed. Click a test point on the schematic.');
render();
};
window['mmcClickProbe_'+thisq] = function(pointName){
state.probes[state.activeProbe] = pointName;
narrate(state.activeProbe+' probe placed on '+pointName.replace(/_/g,' '));
render();
};
window['mmcSetSourceType_'+thisq] = function(t){
state.circuit.source.type = t;
narrate('Source set to '+t);
render();
};
window['mmcSetSourceV_'+thisq] = function(v){
var n = parseFloat(v);
if (!isNaN(n)) { state.circuit.source.V = n; render(); }
};
window['mmcSetSourceF_'+thisq] = function(f){
var n = parseFloat(f);
if (!isNaN(n) && n > 0) { state.circuit.source.freq = n; render(); }
};
window['mmcToggleWire_'+thisq] = function(seg){
state.circuit.wires[seg] = !state.circuit.wires[seg];
narrate('Wire '+seg+' '+(state.circuit.wires[seg]?'connected':'removed'));
render();
};
window['mmcToggleLead_'+thisq] = function(comp, side){
state.circuit.leads[comp][side] = !state.circuit.leads[comp][side];
narrate(comp+' '+side+' lead '+(state.circuit.leads[comp][side]?'connected':'disconnected'));
render();
};
window['mmcToggleA11y_'+thisq] = function(key){
state.a11y[key] = !state.a11y[key];
if (key === 'narration' && state.a11y.narration) narrate('Narration on');
render();
};
window['mmcCycleFont_'+thisq] = function(){
var order = ['normal','large','xl'];
var idx = order.indexOf(state.a11y.fontSize);
state.a11y.fontSize = order[(idx+1)%order.length];
render();
};
window['mmcReplaceFuse_'+thisq] = function(){
state.fuseBlown.mA = false;
state.fuseBlown['10A'] = false;
state.fuseJustBlew = null;
narrate('Fuse replaced. The meter inputs are restored.');
render();
};
/* Initial intro */
if (!state.hasShownIntro) {
state.hasShownIntro = true;
state.lastNarration = 'Multimeter and circuit lab ready. The circuit has a source Vs, resistors R1 and R2, and capacitor C. Set the dial, choose probe positions, and observe what the meter reads.';
}
render();
})();</script></body></html>
