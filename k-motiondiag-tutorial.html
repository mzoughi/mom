<!-- Motion Diagrams tutorial: velocity, acceleration, and their directions.
8 stages chained via the ctStageComplete event.
Stages 1-6: one-dimensional motion diagrams. Stages 7-8: perpendicular and
tangential + perpendicular acceleration in two dimensions.
CSS/JS hosted on GitHub Pages. -->

<script>
  window.ctThisq = '1010';
  // Plain (non-MOM) version: features that call MOM answer boxes are off.
  window['mdConfig_1010'] = {
    momSubmit: false,
    lockBoxes: false,
    answerMap: { score: '001', percent: '002' }
  };
</script>
<link rel="stylesheet" href="https://mzoughi.github.io/mom/motiondiag-core.css">

<script>
  document.addEventListener('ctStageComplete', function(e){
    if (e.detail.thisq !== window.ctThisq) return;
    var nextId = ['ct2Root','ct3Root','ct4Root','ct5Root','ct6Root','ct7Root','ct8Root'][e.detail.stage-1];
    if (nextId) {
      var el = document.getElementById(nextId + window.ctThisq);
      if (el) {
        el.style.display = 'block';
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        el.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'start'});
      }
    }
  });
</script>
