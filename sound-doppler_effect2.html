<!-- ════════ SIMULATION ════════
Pattern: mirrors the VGG (Van de Graaff) and Doppler-1 examples.
- var simObj = function() { ... rst(); return {pl,ps,step,stepBack,rst,toggleMover,toggleSourceSound,toggleObserverSound}; }
- var simObj0914 = new simObj();
- Animation: recursive window.setTimeout(runMotion, trate) guarded by runFlag
- Physics adapted from the original doppler02_-b6x.js / props_-b6x.js (Walter Fendt / Taha Mzoughi "Pass" variant):
ONE object moves at a time (ambulance OR cyclist, chosen by the "Let the cyclist move" checkbox) while the
other stays parked at the canvas center. As the mover passes the stationary one, the perceived frequency
switches from the "approaching" formula to the "receding" formula -- the live audio pitch reflects this.
-->
<script>
var dop2Gen = function() {
var canvas = document.getElementById('dop2Canvas0914');
var ctx    = canvas.getContext('2d');
var W = canvas.width, H = canvas.height;   /* 640 x 320 */
var timer, runFlag = 0, finished = false;
/* ── color helper ── */
function c(prop, def) { return dop2A11y0914.col(prop, def); }
/* ── physics constants / state ── */
var T = 2, C = 34;                 /* wavefront period, wave speed (arbitrary units) */
var V, Vp;                          /* ambulance / cyclist velocities -- exactly one is non-zero */
var cyclistMove = false;            /* false: ambulance moves, cyclist parked. true: reverse. */
var sfrequency = 440, ofrequency = 440, ofrequency1 = 440, ofrequency2 = 440;
var oSound = false, sSound = false, context, gain, oscillator, audioStart = 1, numbOscStarts = 0;
var trate = 40, trate2 = 400;
var index, t, ts, tstart, pstart, pss, wcp, to, pc, wc, arrival;
var bcc = 0, arrivalNarrated = false, passNarrated = false, relDir = 0;
var mx = W/2, my = H/2 + 50, py = H/2 + 33;
var hp = 15, wp = 1.236*hp;
var xs0, px0, x, px, left, adirection, pdirection;
var aw = 50, ah = 0.65*aw, bw = 5, bh = (59/70)*bw;
var colorHouse11 = "#ffff00", colorHouse12 = "#ff0000", colorHouse21 = "#ffc800", colorHouse22 = "#ff00ff";
var colorWindow = "#4040ff", colorDoor = "#604020";
var frameCount = 0, narrationEvery = 20;   /* ~ every 0.8 s at 25fps */
/* ══════════ low-level canvas helpers (adapted from props_-b6x.js) ══════════ */
function newPath(color, thickness){ ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = thickness; }
function line(x1,y1,x2,y2){ ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
function rectangle(x,y,w,h,col){ if(col) ctx.fillStyle = col; newPath("#000000",1); ctx.fillRect(x,y,w,h); ctx.strokeRect(x,y,w,h); }
function circle(x,y,r,fillCol,strokeCol){
if(fillCol) ctx.fillStyle = fillCol;
newPath((strokeCol && typeof strokeCol === 'string') ? strokeCol : 'grey', 1);
ctx.arc(x,y,r,0,2*Math.PI,true);
if(fillCol) ctx.fill();
if(strokeCol) ctx.stroke();
}
function cloud(x,y){
ctx.fillStyle = "#ffffff"; ctx.beginPath();
ctx.arc(x,y,10,0,2*Math.PI,true); ctx.arc(x+5,y+3,10,0,2*Math.PI,true);
ctx.arc(x+13,y-2,10,0,2*Math.PI,true); ctx.arc(x+10,y+5,10,0,2*Math.PI,true);
ctx.arc(x-2,y+5,10,0,2*Math.PI,true); ctx.arc(x+15,y+2,10,0,2*Math.PI,true);
ctx.fill();
}
function tree(x,y,h1,h2){
ctx.strokeStyle = "#550000"; ctx.beginPath();
ctx.moveTo(x+h2/5-1,y+h1); ctx.lineTo(x+h2/5-1,y+h2); ctx.lineTo(x+h2/2-3,y+h2); ctx.lineTo(x+h2/3,y+h1);
ctx.closePath(); ctx.stroke(); ctx.fillStyle="#5F0000"; ctx.fill();
ctx.fillStyle = "#006600"; newPath("#006600",1.5);
ctx.arc(x,y,10,0,2*Math.PI,true); ctx.arc(x+5,y+3,8,0,2*Math.PI,true); ctx.arc(x+13,y-2,8,0,2*Math.PI,true);
ctx.arc(x+7,y-4,8,0,2*Math.PI,true); ctx.arc(x+10,y+5,8,0,2*Math.PI,true); ctx.arc(x-2,y+5,8,0,2*Math.PI,true);
ctx.arc(x+15,y+2,8,0,2*Math.PI,true); ctx.fill();
}
function tree2(x,y,h1,h2){
ctx.strokeStyle = "#550000"; ctx.beginPath();
ctx.moveTo(x+h2/6,y+h1); ctx.lineTo(x+h2/5,y+h2+h1); ctx.lineTo(x-h2/4,y+h2+h1); ctx.lineTo(x-h2/5.5,y+h1);
ctx.closePath(); ctx.stroke(); ctx.fillStyle="#5F0000"; ctx.fill();
ctx.fillStyle = "#006600"; ctx.beginPath();
ctx.moveTo(x,y); ctx.lineTo(x-h1/5,y+h1/2); ctx.lineTo(x-h1/5+h1/10,y+h1/2); ctx.lineTo(x-h1/3,y+h1);
ctx.lineTo(x+h1/3,y+h1); ctx.lineTo(x+h1/5-h1/10,y+h1/2); ctx.lineTo(x+h1/5,y+h1/2);
ctx.closePath(); ctx.stroke(); ctx.fill();
}
function house(c1,c2,x){
rectangle(x-45,my-45,95,45,c1); rectangle(x-50,my-75,105,30,c2);
for(var i=0;i<4;i++) if(i!=2) rectangle(x-35+i*20,my-30,15,15,colorWindow);
rectangle(x+5,my-30,15,30,colorDoor);
}
function addspokes(pcc,sx,sy,sr,st,scol,angDir,speed,vspeed){
if(vspeed!==0){ vspeed = Math.max(Math.abs(V),Math.abs(Vp)); }
var lo, hi;
if(vspeed!==0){
if(pcc%speed < parseInt(speed/3)){ lo=Math.PI/3; hi=5*Math.PI/6; }
else if(pcc%speed < (2*parseInt(speed/3))){ lo=Math.PI/2; hi=Math.PI; }
else { lo=2*Math.PI/3; hi=7*Math.PI/6; }
} else { lo=Math.PI/3; hi=5*Math.PI/6; }
newPath(scol,st);
ctx.moveTo(sx-sr*Math.sin(angDir*lo),sy+sr*Math.cos(angDir*lo));
ctx.lineTo(sx+sr*Math.sin(angDir*lo),sy-sr*Math.cos(angDir*lo)); ctx.stroke();
newPath(scol,st);
ctx.moveTo(sx-sr*Math.sin(angDir*hi),sy+sr*Math.cos(angDir*hi));
ctx.lineTo(sx+sr*Math.sin(angDir*hi),sy-sr*Math.cos(angDir*hi)); ctx.stroke();
}
function ambulance(ax,ay,aw,ah,dirx){
ctx.fillStyle = "#ffffff"; ctx.beginPath();
ctx.moveTo(ax-dirx*40*aw/40,ay-22*ah/26); ctx.lineTo(ax-dirx*8*aw/40,ay-22*ah/26);
ctx.lineTo(ax-dirx*8*aw/40,ay-13*ah/26); ctx.lineTo(ax,ay-13*ah/26); ctx.lineTo(ax,ay-5*ah/26);
ctx.lineTo(ax-dirx*40*aw/40,ay-5*ah/26); ctx.lineTo(ax-dirx*40*aw/40,ay-22*ah/26);
ctx.closePath(); ctx.stroke(); ctx.fill(); ctx.stroke();
rectangle(ax-dirx*17*aw/40,ay-19*ah/26,6*aw/40,7*ah/26,"#0000ff");
if(frameCount%8<4){ ctx.fillStyle = "red"; } else { ctx.fillStyle = "yellow"; }
ctx.fillRect(ax-dirx*16*aw/40,ay-26*ah/26,4*aw/40,4*ah/26);
circle(ax-dirx*32*aw/40,ay-4*ah/26,4*ah/26,"#000000");
circle(ax-dirx*8*aw/40,ay-4*ah/26,4*ah/26,"#000000");
addspokes(frameCount,ax-dirx*32*aw/40,ay-4*ah/26,3*ah/26,2*ah/26,"grey",dirx,6,V);
addspokes(frameCount,ax-dirx*8*aw/40,ay-4*ah/26,3*ah/26,2*ah/26,"grey",dirx,6,V);
}
function cyclist(col,x,y,w,h,dirx){
newPath(col,3*w/110);
ctx.arc(x+dirx*20*w/110,y+70*h/89,24*w/110,0,2*Math.PI,true); ctx.stroke();
addspokes(frameCount,x+dirx*20*w/110,y+70*h/89,24*w/110,3*w/110,col,dirx,9,Vp);
addspokes(frameCount,x+dirx*92*w/110,y+70*h/89,24*w/110,3*w/110,col,dirx,9,Vp);
newPath(col,3*w/110);
ctx.arc(x+dirx*92*w/110,y+70*h/89,24*w/110,0,2*Math.PI,true); ctx.stroke();
newPath(col,1);
ctx.arc(x+dirx*74*w/110,y+10*h/89,7*w/110,0,2*Math.PI,true); ctx.stroke();
ctx.fillStyle=col; ctx.fill();
newPath(col,3*w/110);
ctx.arc(x+dirx*81*w/110,y+32*h/89,7*w/110,0,-Math.PI,true); ctx.stroke();
newPath(col,3*w/110); ctx.moveTo(x+dirx*23*w/110,y+68*h/89); ctx.lineTo(x+dirx*43*w/110,y+48*h/89); ctx.stroke();
newPath(col,3*w/110); ctx.moveTo(x+dirx*40*w/110,y+40*h/89); ctx.lineTo(x+dirx*49*w/110,y+59*h/89); ctx.stroke();
newPath(col,3*w/110); ctx.moveTo(x+dirx*53*w/110,y+67*h/89); ctx.lineTo(x+dirx*75*w/110,y+43*h/89); ctx.stroke();
newPath(col,3*w/110); ctx.moveTo(x+dirx*88*w/110,y+67*h/89); ctx.lineTo(x+dirx*72*w/110,y+34*h/89); ctx.stroke();
ctx.lineWidth = 1.0; ctx.beginPath();
ctx.moveTo(x+dirx*61*w/110,y+10*h/89); ctx.lineTo(x+dirx*34*w/110,y+32*h/89); ctx.lineTo(x+dirx*32*w/110,y+36*h/89);
ctx.lineTo(x+dirx*30*w/110,y+37*h/89); ctx.lineTo(x+dirx*30*w/110,y+41*h/89); ctx.lineTo(x+dirx*47*w/110,y+41*h/89);
ctx.lineTo(x+dirx*58*w/110,y+47*h/89); ctx.lineTo(x+dirx*47*w/110,y+61*h/89); ctx.lineTo(x+dirx*49*w/110,y+66*h/89);
ctx.lineTo(x+dirx*22*w/110,y+68*h/89); ctx.lineTo(x+dirx*22*w/110,y+70*h/89); ctx.lineTo(x+dirx*54*w/110,y+68*h/89);
ctx.lineTo(x+dirx*55*w/110,y+63*h/89); ctx.lineTo(x+dirx*68*w/110,y+45*h/89); ctx.lineTo(x+dirx*66*w/110,y+41*h/89);
ctx.lineTo(x+dirx*53*w/110,y+35*h/89); ctx.lineTo(x+dirx*66*w/110,y+27*h/89); ctx.lineTo(x+dirx*71*w/110,y+35*h/89);
ctx.lineTo(x+dirx*89*w/110,y+35*h/89); ctx.lineTo(x+dirx*88*w/110,y+32*h/89); ctx.lineTo(x+dirx*76*w/110,y+30*h/89);
ctx.lineTo(x+dirx*72*w/110,y+22*h/89);
ctx.closePath(); ctx.strokeStyle = col; ctx.stroke(); ctx.fillStyle=col; ctx.fill();
}
function bird(bx,by,bw,bh,dirx){
var brate=60; ctx.fillStyle = "#000000";
var frac = bcc%brate < (brate/6) ? 0 : bcc%brate < (2*brate/6) ? 1 : 2;
/* simplified two-phase wing flap (see doppler_sim.html for the same simplification). */
ctx.beginPath();
if(frac!==2){
ctx.moveTo(bx+dirx*(-47)*bw/70,by+7*bh/59);
ctx.lineTo(bx+dirx*(-30)*bw/70,by+(frac===0?-8:16)*bh/59);
ctx.lineTo(bx+dirx*(0)*bw/70,by+7*bh/59);
ctx.lineTo(bx+dirx*(30)*bw/70,by+(frac===0?-8:16)*bh/59);
ctx.lineTo(bx+dirx*(47)*bw/70,by+7*bh/59);
} else {
ctx.moveTo(bx+dirx*(-47)*bw/70,by+9*bh/59);
ctx.lineTo(bx+dirx*(0)*bw/70,by+9*bh/59);
ctx.lineTo(bx+dirx*(47)*bw/70,by+9*bh/59);
}
ctx.strokeStyle="#000000"; ctx.lineWidth=1.5; ctx.stroke();
}
/* ══════════ Doppler "pass-by" physics ══════════ */
function whoMoves(){
if (cyclistMove){ px0 = 62; xs0 = mx; if (V!==0){ Vp = V; } V = 0; }
else { px0 = mx; xs0 = 62; if (Vp!==0){ V = Vp; } Vp = 0; }
x = xs0; px = px0;
}
function recomputeFrequencies(){
if (Vp===0){ ofrequency1 = sfrequency*(1-Vp/C)/(1-V/C); ofrequency2 = sfrequency*(1-Vp/C)/(1+V/C); }
if (V===0){  ofrequency1 = sfrequency*(1-Vp/C)/(1-V/C); ofrequency2 = sfrequency*(1+Vp/C)/(1+V/C); }
}
function calcWavefronts(){
arrival = false;
for (var i=0; i*T<t; i++){
var x0 = i*V*T + xs0;
var r  = C*(t-i*T);
var xFront = left ? x0+r : x0-r;
var xBack  = left ? x0-r : x0+r;
var timeWindow = Math.max(Math.abs(V*T), Math.abs(Vp*T));
if (V===0 && Vp===0) timeWindow = (C*T)/5;
if (Math.abs(xFront-px) < timeWindow){ arrival = true; pc = i+1; }
if (Math.abs(xBack-px)  < timeWindow){ arrival = true; pc = i+1; }
if (pc===1 && ts===0){ tstart=t; ts++; }
wc = i;
if (pc===1 && pss===0){ pss++; pstart=wc; }
}
if (tstart===0){ to=0; wcp=0; } else { to = t-tstart; wcp = wc-pstart; }
}
function drawWavefronts(){
for (var i=0; i*T<t; i++){
var x0 = i*V*T + xs0;
var r  = C*(t-i*T);
circle(x0, my-10, r, null, c('--dop2-wave','#888888'));
}
}
function physicsStep(){
index += 1; t = index/10.0;
x  = V*t + xs0;
px = px0 + Vp*t;
left = (V >= 0); adirection = left?1:-1;
pdirection = (Vp<0) ? -1 : 1;
var wasArrival = arrival;
calcWavefronts();
if (arrival && !wasArrival && !arrivalNarrated){
arrivalNarrated = true;
dop2A11y0914.narrate('The first wavefront has just reached the observer.');
}
/* which frequency currently applies -- approaching vs receding -- depends on which
 object is moving and whether it is still short of, or already past, the parked one */
var newRelDir = (px - x) > 0 ? 1 : -1;
if (cyclistMove){
ofrequency = (newRelDir>0) ? ofrequency1 : ofrequency2;
} else {
ofrequency = (newRelDir<0) ? ofrequency2 : ofrequency1;
}
if (relDir!==0 && newRelDir!==relDir && !passNarrated){
passNarrated = true;
dop2A11y0914.narrate((cyclistMove?'The cyclist has':'The ambulance has')+' just passed the stationary one -- the pitch drops from here on.');
}
relDir = newRelDir;
updateLiveObserverSound();
var stopCond = false;
if (V===0 && Vp===0 && (1000*to/trate2) > trate2/2) stopCond = true;
else if (x>1.25*W || px>1.25*W || x<-0.25*W || px<-0.25*W) stopCond = true;
if (stopCond){
runFlag = 0; finished = true;
if (audioStart>1 && gain){ gain.gain.value = 0; }
audioStart = 1;
}
}
function displayData(bx,by,w,h){
ctx.textBaseline='middle'; ctx.fillStyle=c('--dop2-databox-bg','#ffff00'); ctx.strokeStyle=c('--dop2-databox-border','#ff0000');
ctx.lineWidth=0; ctx.beginPath(); ctx.rect(bx,by,w,h); ctx.fill(); ctx.stroke();
ctx.font='11pt Calibri'; ctx.fillStyle=c('--dop2-text','#111111'); ctx.textAlign='left';
var fChar = String.fromCharCode(0x0192), oSub = String.fromCharCode(0x2092);
var Label = 'Animation time = '+(1000*t/trate2).toFixed(0)+' ms';
ctx.fillText(Label, bx+6, by+10);
Label = 'Source frequency: '+fChar+' = '+sfrequency.toFixed(0)+' Hz';
ctx.fillText(Label, bx+6, by+30);
Label = 'Perceived by observer: '+fChar+oSub+' = '+ofrequency.toFixed(0)+' Hz';
ctx.fillText(Label, bx+6, by+50);
Label = 'Status: '+(relDir>0 ? 'Approaching (pitch rising)' : 'Moving away (pitch falling)');
ctx.fillText(Label, bx+6, by+70);
}
function displayEnd(bx,by,w,h){
ctx.textBaseline='middle'; ctx.fillStyle=c('--dop2-databox-bg','#ffff00'); ctx.strokeStyle=c('--dop2-databox-border','#ff0000');
ctx.lineWidth=0; ctx.beginPath(); ctx.rect(bx,by,w,h); ctx.fill(); ctx.stroke();
ctx.font='11pt Calibri'; ctx.fillStyle=c('--dop2-text','#111111'); ctx.textAlign='left';
ctx.fillText('Animation Ended!', bx+6, by+10);
ctx.fillText('Press "Restart"', bx+6, by+30);
ctx.fillText('to play again.', bx+6, by+50);
}
function drawFrame(){
rectangle(0,0,W,my,c('--dop2-sky','#00ffff'));
circle(60,30,10,c('--dop2-sun','#ffd000'),'grey');
bcc++;
cloud(200-t,50+0.5*t); cloud(400-0.5*t,80); cloud(550+0.5*t,40+0.5*t);
tree(145,my-25,11,25);
tree2(505,my-55,40,15); tree2(590,my-75,60,15); tree2(25,my-45,30,15); tree2(235,my-45,30,15);
house(colorHouse11,colorHouse12,100); house(colorHouse21,colorHouse22,350);
tree(50,my-25,11,25); tree(195,my-25,11,25); tree(215,my-20,11,25); tree(265,my-25,11,25);
tree(395,my-25,11,25); tree(455,my-35,11,35); tree(555,my-25,11,25);
bird(100+2*t,80+0.5*t,bw,bh,1); bird(350-2*t,my-77-1*t,bw,bh,-1); bird(555+2*t,my-25-1*t,bw,bh,1);
ambulance(x,my,aw,ah,adirection);
drawWavefronts();
cyclist(arrival ? c('--dop2-cyclist-hit','#ff0000') : c('--dop2-cyclist','#000000'), px,py,wp,hp,pdirection);
rectangle(0,my,W,H-my,c('--dop2-ground','#c0c0c0'));
if (t>0) displayData(0.7*mx,my+5,1.3*mx-5,90);
if (runFlag===0 && t>0) displayEnd(0.05*mx,my+5,0.4*mx-5,60);
}
/* ── narration of the current scene (used on Step / periodically during Play) ── */
function sceneNarration(){
var msg = '';
var mover = cyclistMove ? 'cyclist' : 'ambulance';
var stayer = cyclistMove ? 'ambulance' : 'cyclist';
msg += 'The '+mover+' is moving; the '+stayer+' stays parked at the center. ';
msg += relDir>0 ? 'The '+mover+' is approaching -- pitch is rising. ' : 'The '+mover+' has passed and is moving away -- pitch is falling. ';
msg += arrival ? 'A wavefront has just reached the observer -- shown highlighted. ' : '';
if (t>0){ msg += 'Perceived frequency: '+ofrequency.toFixed(0)+' Hz (source: '+sfrequency.toFixed(0)+' Hz). '; }
if (runFlag===0 && finished){ msg += 'The animation has ended. Press Restart to play again.'; }
dop2A11y0914.narrate(msg);
}
/* ── sound ── */
function initSound(){
if (numbOscStarts<7){
try{
window.AudioContext = window.AudioContext || window.webkitAudioContext;
context = new AudioContext();
gain = context.createGain(); gain.gain.value = 1;
oscillator = context.createOscillator();
} catch(e){ /* Web Audio unsupported */ }
}
}
function playSound(f){
if (audioStart===1 && numbOscStarts<7){ initSound(); audioStart++; }
if (!oscillator || !gain) return;
if (context && context.state==='suspended'){ try{ context.resume(); }catch(e){} }
oscillator.type = 'sine'; oscillator.frequency.value = f; oscillator.detune.value = 0;
oscillator.connect(gain); gain.connect(context.destination);
if (audioStart===2 && numbOscStarts<7){ try{ oscillator.start(0); }catch(e){} }
numbOscStarts++;
}
/* live pitch-shift while the observer-sound checkbox is on and the sim is playing */
function updateLiveObserverSound(){
if (oSound && runFlag===1){
if (audioStart===1){ playSound(ofrequency); }
else if (oscillator){ oscillator.frequency.value = ofrequency; gain.gain.value = 1; }
}
}
function toggleSourceSound(){
var cb = document.getElementById('dop2SoundS0914');
var cbO = document.getElementById('dop2Sound0914');
if (cb.checked){
cbO.checked=false; oSound=false; sSound=true;
if (runFlag===1){ if(audioStart===1){ playSound(sfrequency); } else if(oscillator){ oscillator.frequency.value=sfrequency; gain.gain.value=1; } }
} else { sSound=false; if(gain) gain.gain.value=0; }
}
function toggleObserverSound(){
var cb = document.getElementById('dop2Sound0914');
var cbS = document.getElementById('dop2SoundS0914');
if (cb.checked){
cbS.checked=false; sSound=false; oSound=true;
if (runFlag===1){ if(audioStart===1){ playSound(ofrequency); } else if(oscillator){ oscillator.frequency.value=ofrequency; gain.gain.value=1; } }
} else { oSound=false; if(gain) gain.gain.value=0; }
}
function toggleMover(){
var cb = document.getElementById('dop2Mover0914');
cyclistMove = !!(cb && cb.checked);
rst();
}
/* ── animation loop ── */
function runMotion(){
physicsStep();
drawFrame();
frameCount++;
if (!finished && frameCount % narrationEvery === 0){ sceneNarration(); }
if (finished){
var playBtn = document.getElementById('dop2Play0914'); if(playBtn) playBtn.value='Play';
sceneNarration();
}
if (runFlag===1 && !finished){ timer = window.setTimeout(runMotion, trate); }
}
/* ── public: play ── */
function pl(){
window.clearTimeout(timer);
runFlag = 1; finished = false;
if (sSound){ try{ playSound(sfrequency); }catch(e){} }
runMotion();
}
/* ── public: pause ── */
function ps(){ window.clearTimeout(timer); runFlag = 0; }
/* ── public: single step ── */
function step(){ window.clearTimeout(timer); runFlag = 0; physicsStep(); drawFrame(); sceneNarration(); }
/* ── public: step back ── */
function stepBack(){
window.clearTimeout(timer); runFlag = 0;
index -= 2; if (index < -1) index = -1;
physicsStep(); drawFrame(); sceneNarration();
}
/* ── public: restart ── */
function rst(){
window.clearTimeout(timer); runFlag = 0; finished = false; arrivalNarrated = false; passNarrated = false;
var cbMover = document.getElementById('dop2Mover0914');
cyclistMove = !!(cbMover && cbMover.checked);
var VsEl = document.getElementById('dop2Vs0914');
var VsMult = VsEl ? parseFloat(VsEl.value) : 0.5;
var speedC = VsMult*C;
if (cyclistMove){ V=0; Vp=speedC; } else { V=speedC; Vp=0; }
whoMoves();
recomputeFrequencies();
ofrequency = ofrequency1;
index = -1; t = 0; ts = 0;
arrival = false; pc = 0; wc = 0; tstart = 0; pstart = 0; pss = 0; wcp = 0; to = 0;
bcc = 0; frameCount = 0; relDir = 1;
left = (V>=0); adirection = left?1:-1; pdirection = (Vp<0)?-1:1;
if (audioStart>1 && oscillator){ try{ oscillator.stop(0); }catch(e){} }
audioStart = 1; if (gain) gain.gain.value = 0;
oSound = false; sSound = false;
var cbS=document.getElementById('dop2SoundS0914'); if(cbS) cbS.checked=false;
var cbO=document.getElementById('dop2Sound0914');  if(cbO) cbO.checked=false;
var playBtn=document.getElementById('dop2Play0914'); if(playBtn) playBtn.value='Play';
drawFrame();
var mover = cyclistMove ? 'cyclist' : 'ambulance';
dop2A11y0914.narrate('Ready. The '+mover+' will move at '+VsMult+' times the wave speed and pass the stationary one. Press Play.');
}
/* boot */
rst();
return { pl:pl, ps:ps, step:step, stepBack:stepBack, rst:rst, toggleMover:toggleMover, toggleSourceSound:toggleSourceSound, toggleObserverSound:toggleObserverSound };
};
var dop2Sim0914 = new dop2Gen();
</script>
