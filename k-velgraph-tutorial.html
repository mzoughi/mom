<h1 style="font-family:'Noto Sans','Segoe UI',Arial,sans-serif;font-size:1.5em;max-width:940px;margin:0 auto 6px">Velocity Graphs and Motion Diagrams</h1>
<p style="font-family:'Noto Sans','Segoe UI',Arial,sans-serif;max-width:940px;margin:0 auto 14px">Work through the five stages in order. Each stage opens below the previous one when you answer its questions correctly.</p>
<!-- Velocity Graphs tutorial: velocity graphs and motion diagrams.
5 stages chained via the ctStageComplete event.
Stages 1-2: graph + motion diagram. Stage 3: match the motion.
Stage 4: match the velocity graph. Stage 5: three-phase velocity graph.
CSS/JS hosted on GitHub Pages. -->
<div id="ctRoot1010"></div>
<div id="ct2Root1010" style="display:none"></div>
<div id="ct3Root1010" style="display:none"></div>
<div id="ct4Root1010" style="display:none"></div>
<div id="ct5Root1010" style="display:none"></div>
<script>
  window.ctThisq = '1010';
  // Plain (non-MOM) version: features that call MOM answer boxes are off.
  window['vgConfig_1010'] = {
    momSubmit: false,
    lockBoxes: false,
    answerMap: { score: '001', percent: '002' }
  };
</script>
<link rel="stylesheet" href="https://mzoughi.github.io/mom/velgraph-core.css">
<script src="https://mzoughi.github.io/mom/velgraph-core.js"></script>
<script src="https://mzoughi.github.io/mom/velgraph-st1.js"></script>
<script src="https://mzoughi.github.io/mom/velgraph-st2.js"></script>
<script src="https://mzoughi.github.io/mom/velgraph-st3.js"></script>
<script src="https://mzoughi.github.io/mom/velgraph-st4.js"></script>
<script src="https://mzoughi.github.io/mom/velgraph-st5.js"></script>
<script>
  document.addEventListener('ctStageComplete', function(e){
    if (e.detail.thisq !== window.ctThisq) return;
    var nextId = ['ct2Root','ct3Root','ct4Root','ct5Root'][e.detail.stage-1];
    if (nextId) {
      var el = document.getElementById(nextId + window.ctThisq);
      if (el) {
        el.style.display = 'block';
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        el.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'start'});
      }
    }
  });
</script>
