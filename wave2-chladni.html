<script>
var chlA11y = (function(){
  var ROOT = null;
  var states = { hc:false, lm:false, cb:false, nr:true };
  var DEFS = { '--chl-bg':'#ffffff', '--chl-plate':'#5a6068', '--chl-plate2':'#7a828c', '--chl-sand':'#f3e2b3', '--chl-text':'#111111', '--chl-dim':'#555555',

    '--chl-map1':'#2040a0', '--chl-map2':'#ff4020', '--chl-wood':'#b8865a', '--chl-toolbar-bg':'#222' };
  var THEMES = {
    hc: { '--chl-bg':'#000000', '--chl-plate':'#000000', '--chl-plate2':'#202020', '--chl-sand':'#ffff00', '--chl-text':'#ffffff', '--chl-dim':'#dddddd',
          '--chl-panel':'#000000', '--chl-edge':'#ffffff', '--chl-curve':'#00e8d0', '--chl-marker':'#ff5555', '--chl-lcd':'#00ff88', '--chl-lcdbg':'#001a00',
          '--chl-map1':'#0000ff', '--chl-map2':'#ff0000', '--chl-wood':'#777777', '--chl-toolbar-bg':'#000' },
    lm: { '--chl-bg':'#fbfbf8', '--chl-plate':'#6a707a', '--chl-plate2':'#8a929c', '--chl-panel':'#ffffff', '--chl-toolbar-bg':'#444' },
    cb: { '--chl-curve':'#0072b2', '--chl-marker':'#d55e00', '--chl-map1':'#0072b2', '--chl-map2':'#e69f00', '--chl-sand':'#f0e442' }
  };
  var cur = {};
  function applyVars(){
    if (!ROOT) return; var p, order = ['lm','cb','hc'];
    cur = {}; for (p in DEFS) cur[p] = DEFS[p];
    for (var i = 0; i < order.length; i++) if (states[order[i]]) { var t = THEMES[order[i]]; for (p in t) cur[p] = t[p]; }
    for (p in cur) ROOT.style.setProperty(p, cur[p]);
  }
  function styleBtn(id, on){
    var b = document.getElementById(id); if (!b) return;
    b.style.background = on ? 'rgba(0,232,208,.12)' : '#2a2e3a'; b.style.borderColor = on ? '#00e8d0' : '#404a60'; b.style.color = on ? '#00e8d0' : '#7a8aaa';
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  function apply(){
    if (!ROOT) return; applyVars();
    var nb = document.getElementById('chlNarBar'); if (nb) nb.style.display = states.nr ? 'block' : 'none';
    var btn = document.getElementById('chlBtnNR'); if (btn) btn.textContent = 'NARRATION: ' + (states.nr ? 'ON' : 'OFF');
    styleBtn('chlBtnNR', states.nr); styleBtn('chlBtnHC', states.hc); styleBtn('chlBtnLM', states.lm); styleBtn('chlBtnCB', states.cb);
  }
  return {
    init: function(){ ROOT = document.getElementById('chlRoot'); apply(); },
    toggle: function(k){
      states[k] = !states[k];
      if (k === 'hc' && states.hc) states.lm = false;
      if (k === 'lm' && states.lm) states.hc = false;
      apply();
      if (typeof chlSim !== 'undefined' && chlSim.refresh) chlSim.refresh();
    },
    narrate: function(msg){ if (!states.nr) return; var nb = document.getElementById('chlNarBar'); if (nb) nb.textContent = msg; },
    col: function(prop){ return cur[prop] || DEFS[prop]; }
  };
})();
</script>
<!-- ════════ SIMULATION ════════
Pattern: mirrors the VDG example: var simObj = function() { ... return {...}; };  var simObj = new simObj();
Physics -- a plate SCREWED ONTO a vibrator at its mounting point (as in the classroom demo):
  1. Start from a set of smooth plate shapes (a basis): for the disk J_m(alpha r) cos(m theta) with J_m'(alpha) = 0,
     for the square cos(p pi (x+1/2)) cos(q pi (y+1/2)), plus the rigid motions (up-down and tilts).
     For these shapes the bending energy integral of (Laplacian w)^2 is diagonal, so the stiffness matrix K is known
     exactly; the mass matrix M is computed from their overlaps.
  2. The mount clamps the plate: at the mounting point the plate cannot move or tilt relative to the vibrator
     (w = 0, dw/dx = 0, dw/dy = 0). The modes of the clamped plate are found with these constraints by solving
     K a = lambda M a in the constrained subspace (Rayleigh-Ritz, Jacobi eigenvalue method).
     An off-centre clamp breaks the plate's symmetry: the nodal lines bend into curves, as on real plates.
  3. The vibrator shakes the mount up and down. In the plate's frame this acts like a uniform force, so mode k is
     excited in proportion to its average displacement  c_k = (1/sqrt(A)) integral psi_k dA, with resonance factor
     r^2/(1 - r^2 + i r/Q), r = f/f_k, Q = 200. Absolute motion u = mount motion + sum of the mode motions.
  4. Sand: each grain hops by an amount proportional to |u| and drifts toward quieter regions,
     so it gathers on the nodal lines where the plate stays still.
  Frequencies: disk f = 7 alpha^2 Hz (radius 1), square f = 25 (p^2 + q^2) Hz for the basis shapes.
-->
<script>
var chlGen = function() {
  var canvas = document.getElementById('chlCanvas');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  function c(k) { return chlA11y.col(k); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  var reducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ── settings ── */
  var shape = 'disk', drive = 'center', offset = 0.3, freq = 300, amp = 1, showMap = false, sound = false, sweeping = false, Q = 200, dwell = 0;
  var FMIN = 50, FMAX = 3000, G = 128, F0D = 7, F0S = 25/(Math.PI*Math.PI);

  /* ── Bessel functions ── */
  function besselJ(m, x) { var N = 96, s = 0; for (var k = 0; k <= N; k++) { var t = Math.PI*k/N, v = Math.cos(m*t - x*Math.sin(t)); s += (k === 0 || k === N) ? v/2 : v; } return s/N; }
  function dJ(m, x) { return m === 0 ? -besselJ(1, x) : 0.5*(besselJ(m - 1, x) - besselJ(m + 1, x)); }
  function zerosDJ(m, xmax) {
    var out = [], step = 0.05, x0 = Math.max(0.3, m), y0 = dJ(m, x0);   /* the first zero of J_m' lies beyond x = m; below that J_m is tiny and numerically noisy */
    for (var x = x0 + step; x < xmax; x += step) {
      var y = dJ(m, x);
      if (y0*y < 0) { var a = x - step, b = x, fa = y0; for (var it = 0; it < 30; it++) { var mid = (a + b)/2, fm = dJ(m, mid); if (fa*fm <= 0) b = mid; else { a = mid; fa = fm; } } out.push((a + b)/2); }
      y0 = y;
    }
    return out;
  }

  /* ── grid ── */
  function gridXY(i, j, sh) { return sh === 'disk' ? [-1 + 2*(i + 0.5)/G, -1 + 2*(j + 0.5)/G] : [-0.5 + (i + 0.5)/G, -0.5 + (j + 0.5)/G]; }

  /* ── bases (built once) ──
     Each basis: n functions, grid values phi[i], stiffness kap[i] (0 for rigid motions), sparse off-diagonal mass
     entries moff = [[i, j, value]], point evaluation val(i, x, y) -> [w, dw/dx, dw/dy], info[i] for labels, cIdx = constant. */
  var BASIS = {};
  function buildDiskBasis() {
    /* Only the shapes symmetric about the x-axis (cos m theta): the mount sits on the x-axis and the shaking is
       uniform, so the antisymmetric (sin m theta) shapes can never be excited. */
    var amax = Math.sqrt(FMAX*1.5/F0D), B = { n: 0, phi: [], kap: [], moff: [], info: [], ev: [] }, NR = 240, i, j;
    var gr = new Float32Array(G*G), gth = new Float32Array(G*G), inside = new Uint8Array(G*G);
    for (j = 0; j < G; j++) for (i = 0; i < G; i++) { var xy = gridXY(i, j, 'disk'), k = j*G + i; gr[k] = Math.sqrt(xy[0]*xy[0] + xy[1]*xy[1]); gth[k] = Math.atan2(xy[1], xy[0]); inside[k] = gr[k] <= 1 ? 1 : 0; }
    function add(phi, kap, info, ev) { B.phi.push(phi); B.kap.push(kap); B.info.push(info); B.ev.push(ev); return B.n++; }
    /* rigid: constant and tilt about the y-axis (x) */
    var nc = Math.sqrt(Math.PI), nx = Math.sqrt(Math.PI/4), pc = new Float32Array(G*G), px = new Float32Array(G*G);
    for (k = 0; k < G*G; k++) { if (!inside[k]) continue; pc[k] = 1/nc; px[k] = gr[k]*Math.cos(gth[k])/nx; }
    B.cIdx = add(pc, 0, { rigid: true }, function(x, y) { return [1/nc, 0, 0]; });
    var xIdx = add(px, 0, { rigid: true }, function(x, y) { return [x/nx, 1/nx, 0]; });
    for (var m = 0; m <= 30; m++) {
      var zs = zerosDJ(m, amax + 0.1); if (!zs.length) break;
      zs.forEach(function(al) {
        var tab = new Float64Array(NR + 1), s2 = 0, circles = 0, prev = 0, r;
        for (r = 0; r <= NR; r++) { var v = besselJ(m, al*r/NR); tab[r] = v; var rr = r/NR, w8 = (r === 0 || r === NR) ? 0.5 : 1; s2 += w8*v*v*rr/NR; if (r > 2 && prev*v < 0) circles++; prev = v; }
        var nrm = Math.sqrt(s2*(m === 0 ? 2*Math.PI : Math.PI)), phi = new Float32Array(G*G);
        for (var k2 = 0; k2 < G*G; k2++) { if (!inside[k2]) continue; var u = gr[k2]*NR, i0 = Math.floor(u), fr = u - i0, v2 = i0 >= NR ? tab[NR] : tab[i0] + fr*(tab[i0 + 1] - tab[i0]); phi[k2] = v2*Math.cos(m*gth[k2])/nrm; }
        var idx = add(phi, Math.pow(al, 4), { m: m, circles: circles }, (function(m, al, nrm) { return function(x, y) {
          var rr = Math.sqrt(x*x + y*y), th = Math.atan2(y, x), J = besselJ(m, al*rr), dJr = al*dJ(m, al*rr), cs = Math.cos(m*th), sn = Math.sin(m*th);
          /* d/dx = cos(th) d/dr - sin(th)/r d/dth ; at r = 0 only m = 1 has a slope */
          if (rr < 1e-9) return [m === 0 ? 1/nrm : 0, m === 1 ? al/2/nrm : 0, 0];
          var dwdr = dJr*cs, dwdth = -m*J*sn, ct = Math.cos(th), st = Math.sin(th);
          return [J*cs/nrm, (ct*dwdr - st/rr*dwdth)/nrm, (st*dwdr + ct/rr*dwdth)/nrm];
        }; })(m, al, nrm));
        if (m === 1) { /* overlap with the tilt: pi * integral r^2 J1(alpha r) dr */ var s3 = 0; for (r = 0; r <= NR; r++) { var w9 = (r === 0 || r === NR) ? 0.5 : 1, rr2 = r/NR; s3 += w9*rr2*rr2*tab[r]/NR; } B.moff.push([xIdx, idx, Math.PI*s3/(nx*nrm)]); }
      });
    }
    B.F0 = F0D; return B;
  }
  function buildSquareBasis() {
    var B = { n: 0, phi: [], kap: [], moff: [], info: [], ev: [] }, i, j, k, p, q;
    function add(phi, kap, info, ev) { B.phi.push(phi); B.kap.push(kap); B.info.push(info); B.ev.push(ev); return B.n++; }
    var P = 14, cx = [], sxv = [];
    for (p = 0; p <= P; p++) { cx.push(new Float32Array(G)); for (i = 0; i < G; i++) cx[p][i] = Math.cos(p*Math.PI*(-0.5 + (i + 0.5)/G + 0.5)); }
    var n12 = Math.sqrt(1/12), pxg = new Float32Array(G*G), pyg = new Float32Array(G*G);
    for (j = 0; j < G; j++) for (i = 0; i < G; i++) { var xy = gridXY(i, j, 'square'); pxg[j*G + i] = xy[0]/n12; pyg[j*G + i] = xy[1]/n12; }
    var xIdx = add(pxg, 0, { rigid: true }, function(x, y) { return [x/n12, 1/n12, 0]; });
    var yIdx = add(pyg, 0, { rigid: true }, function(x, y) { return [y/n12, 0, 1/n12]; });
    function cpv(p, u) { return Math.cos(p*Math.PI*(u + 0.5)); }
    function dcpv(p, u) { return -p*Math.PI*Math.sin(p*Math.PI*(u + 0.5)); }
    function xOverlap(p) { var s = 0, N = 400; for (var t = 0; t <= N; t++) { var u = -0.5 + t/N, w = (t === 0 || t === N) ? 0.5 : 1; s += w*u*cpv(p, u)/N; } return s; }
    for (p = 0; p <= P; p++) for (q = 0; q <= P; q++) {
      var s2 = p*p + q*q; if (25*s2 > FMAX*1.5) continue;
      var np = (p === 0 ? 1 : 0.5)*(q === 0 ? 1 : 0.5), nr = Math.sqrt(np), phi = new Float32Array(G*G);
      for (j = 0; j < G; j++) for (i = 0; i < G; i++) phi[j*G + i] = cx[p][i]*cx[q][j]/nr;
      var idx = add(phi, Math.pow(Math.PI*Math.PI*s2, 2), { p: p, q: q, rigid: s2 === 0 }, (function(p, q, nr) { return function(x, y) { return [cpv(p, x)*cpv(q, y)/nr, dcpv(p, x)*cpv(q, y)/nr, cpv(p, x)*dcpv(q, y)/nr]; }; })(p, q, nr));
      if (s2 === 0) B.cIdx = idx;
      if (q === 0 && p % 2 === 1) B.moff.push([xIdx, idx, xOverlap(p)/(n12*nr)]);
      if (p === 0 && q % 2 === 1) B.moff.push([yIdx, idx, xOverlap(q)/(n12*nr)]);
    }
    B.F0 = F0S; return B;
  }

  /* ── linear algebra ── */
  function jacobiEig(A, n) {
    var V = new Float64Array(n*n), i, p, q, k;
    for (i = 0; i < n; i++) V[i*n + i] = 1;
    for (var sweep = 0; sweep < 60; sweep++) {
      var off = 0, dia = 0; for (p = 0; p < n; p++) { dia += A[p*n + p]*A[p*n + p]; for (q = p + 1; q < n; q++) off += A[p*n + q]*A[p*n + q]; }
      if (off < 1e-22*dia) break;

  /* ── sound ── */
  var actx = null, osc = null, gain = null;
  function soundUpdate() {
    if (!sound) { if (gain && actx) gain.gain.setTargetAtTime(0, actx.currentTime, 0.03); return; }
    if (!actx) { try { var AC = window.AudioContext || window.webkitAudioContext; actx = new AC(); osc = actx.createOscillator(); gain = actx.createGain(); gain.gain.value = 0; osc.connect(gain); gain.connect(actx.destination); osc.start(); } catch (e) { actx = null; return; } }
    if (actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
    osc.frequency.setTargetAtTime(freq, actx.currentTime, 0.02);
    gain.gain.setTargetAtTime(0.02 + 0.13*level*Math.min(1, amp), actx.currentTime, 0.05);
  }

  /* ── narration ── */
  function narrateState(prefix) {
    var md = MODES[nearIdx], s = prefix ? prefix + ' ' : '';
    s += (shape === 'disk' ? 'Disk' : 'Square plate') + ' screwed to the vibrator ' + (drive === 'center' ? 'at its centre' : Math.round(offset*100) + '% of the way to the edge') + ', ' + Math.round(freq) + ' Hz. ';
    if (onRes()) {
      s += 'Resonance! The plate vibrates strongly (' + label(md) + ', ' + Math.round(md.f) + ' Hz). The sand is thrown off the moving regions and collects on the nodal lines, where the plate stays still. ';
      if (drive !== 'center') s += 'Because the plate is held off-centre, its patterns lose their symmetry: circles shift and lines bend toward the mounting point. ';
    } else s += 'Between resonances the plate hardly vibrates, so the sand stays put. The nearest resonance is at ' + (md ? Math.round(md.f) + ' Hz' : '?') + '. ';
    if (drive === 'center') s += shape === 'disk' ? 'Held at the centre and shaken up and down, the disk can only respond with circular patterns.' : 'Held at the centre, the square only shows patterns with its full symmetry.';
    chlA11y.narrate(s);
  }

  /* ── loop ── */
  var timer = null, last = 0, narrT = 0, lastOn = false;
  function loop(ts) {
    var dt = last ? Math.min(0.05, (ts - last)/1000) : 0.016; last = ts;
    if (sweeping) {
      if (dwell > 0) dwell -= dt;
      else {
        var fNext = freq*Math.exp(0.09*dt), hit = null;
        for (var k = 0; k < MODES.length; k++) if (excitable(MODES[k]) && MODES[k].f > freq*1.0005 && MODES[k].f <= fNext && (!hit || MODES[k].f < hit.f)) hit = MODES[k];
        if (hit) { setFreq(hit.f, true); dwell = 5; narrateState('Sweep: resonance found, pausing here for a few seconds.'); }
        else setFreq(fNext, true);
        if (freq >= FMAX) { sweeping = false; updateSweepBtn(); }
      }
    }
    ph += dt*2*Math.PI*1.2;
    moveSand(dt); draw();
    var on = onRes(); narrT += dt;
    if (on !== lastOn && narrT > 0.4) { narrT = 0; lastOn = on; narrateState(''); }
    timer = window.requestAnimationFrame(loop);
  }

  /* ── controls ── */
  function sliderFromF(f) { return Math.round(4000*Math.log(f/FMIN)/Math.log(FMAX/FMIN)); }
  function setFreq(f, quiet) {
    freq = clamp(f, FMIN, FMAX); compute(); soundUpdate();
    var s = document.getElementById('chlF'); if (s) s.value = sliderFromF(freq);
    var v = document.getElementById('chlFVal'); if (v) v.textContent = freq.toFixed(freq < 1000 ? 1 : 0) + ' Hz';
    if (!quiet) narrateState('');
  }
  function setSlider(v) { setFreq(FMIN*Math.pow(FMAX/FMIN, v/4000)); }
  function nudge(k) { setFreq(freq*k); }
  function jump(dir) {
    var best = null;
    for (var k = 0; k < MODES.length; k++) {
      if (!excitable(MODES[k])) continue;
      if (dir > 0 && MODES[k].f > freq*1.003 && (!best || MODES[k].f < best.f)) best = MODES[k];
      if (dir < 0 && MODES[k].f < freq/1.003 && (!best || MODES[k].f > best.f)) best = MODES[k];
    }
    if (best) { sweeping = false; updateSweepBtn(); setFreq(best.f, true); narrateState('Jumped to the ' + (dir > 0 ? 'next' : 'previous') + ' resonance.'); }
    else chlA11y.narrate('No more resonances in that direction (50 Hz to 3 kHz) for this set-up.');
  }
  function updateSweepBtn() { var b = document.getElementById('chlSweep'); if (b) b.value = sweeping ? 'Pause \u275a\u275a' : 'Sweep \u25b6'; }
  function toggleSweep() { sweeping = !sweeping; if (sweeping && freq >= FMAX*0.99) setFreq(FMIN, true); updateSweepBtn(); chlA11y.narrate(sweeping ? 'Sweeping the frequency upward. At each resonance the sweep pauses so the sand can form a pattern.' : 'Sweep paused at ' + Math.round(freq) + ' Hz.'); }
  function setTog(id, on) { var b = document.getElementById(id); if (b) { b.classList.toggle('chl_on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); } }
  function rebuild(msg) {
    chlA11y.narrate('Working out the vibration modes of the plate held at this point...');
    setTimeout(function() { loadModes(); sprinkle(); setFreq(freq, true); narrateState(msg); }, 20);
  }
  function setShape(sh) { shape = sh; setTog('chlDisk', sh === 'disk'); setTog('chlSquare', sh === 'square'); rebuild('New plate.'); }
  function setDrive(dv) { drive = dv; setTog('chlCenter', dv === 'center'); setTog('chlOff', dv === 'off'); var o = document.getElementById('chlOffset'); if (o) o.disabled = dv === 'center'; rebuild('Mounting point moved.'); }
  var offTimer = null;
  function setOffset(v) { offset = parseFloat(v); var e = document.getElementById('chlOffVal'); if (e) e.textContent = Math.round(offset*100) + '%'; if (drive !== 'off') return; clearTimeout(offTimer); offTimer = setTimeout(function() { rebuild('Mounting point moved.'); }, 250); }
  function setAmp(v) { amp = parseFloat(v); soundUpdate(); }
  function setMap(on) { showMap = on; if (on) buildMap(); }
  function setSound(on) { sound = on; soundUpdate(); }
  function refresh() { if (showMap) buildMap(); draw(); }

  canvas.addEventListener('click', function(e) {
    var r = canvas.getBoundingClientRect(), x = (e.clientX - r.left)*W/r.width, y = (e.clientY - r.top)*H/r.height;
    if (x > 358 && x < 624 && y > 230 && y < 344) {
      sweeping = false; updateSweepBtn();
      var f = FMIN*Math.pow(FMAX/FMIN, (x - 358)/(624 - 358)), best = null;
      for (var k = 0; k < MODES.length; k++) if (excitable(MODES[k]) && Math.abs(Math.log(MODES[k].f/f)) < 0.025 && (!best || Math.abs(Math.log(MODES[k].f/f)) < Math.abs(Math.log(best.f/f)))) best = MODES[k];
      setFreq(best ? best.f : f, true); narrateState(best ? 'Tuned to the resonance you clicked.' : '');
    }
  });
  document.addEventListener('visibilitychange', function() { if (document.hidden && sound && gain && actx) gain.gain.setTargetAtTime(0, actx.currentTime, 0.02); else if (!document.hidden) soundUpdate(); });

  /* ── boot ── */
  loadModes(); sprinkle(); setFreq(freq, true);
  chlA11y.narrate('Ready. A disk is screwed to the vibrator at its centre and sprinkled with sand. Press Sweep, click a resonance in the spectrum, or use Next resonance.');
  timer = window.requestAnimationFrame(loop);
  return { toggleSweep: toggleSweep, jump: jump, sprinkle: function() { sprinkle(); chlA11y.narrate('Fresh sand sprinkled.'); }, setShape: setShape, setDrive: setDrive, setOffset: setOffset,
           setSlider: setSlider, nudge: nudge, setAmp: setAmp, setMap: setMap, setSound: setSound, refresh: refresh };
};
chlA11y.init();
var chlSim = new chlGen();
</script>
</main>
</body>
</html>
