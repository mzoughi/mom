<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirchhoff's Rules Tutorial</title>
</head>
<body>
<hr>
<!-- Example 3: 11 resistors and 3 batteries.
5 stages chained via the ctStageComplete event.
CSS/JS hosted on GitHub Pages. -->
<div id="ctRoot820"></div>
<div id="ct2Root820" style="display:none"></div>
<div id="ct3Root820" style="display:none"></div>
<div id="ct4Root820" style="display:none"></div>
<div id="ct5Root820" style="display:none"></div>
<script>window.ctThisq = '820';</script>
<link rel="stylesheet" href="https://mzoughi.github.io/mom/kirchoff-ex3-st1.css">
<link rel="stylesheet" href="https://mzoughi.github.io/mom/kirchoff-ex3-st2.css">
<link rel="stylesheet" href="https://mzoughi.github.io/mom/kirchoff-ex3-st3.css">
<link rel="stylesheet" href="https://mzoughi.github.io/mom/kirchoff-ex3-st4.css">
<link rel="stylesheet" href="https://mzoughi.github.io/mom/kirchoff-ex3-st5.css">
<script src="https://mzoughi.github.io/mom/kirchoff-ex3-st1.js"></script>
<script src="https://mzoughi.github.io/mom/kirchoff-ex3-st2.js"></script>
<script src="https://mzoughi.github.io/mom/kirchoff-ex3-st3.js"></script>
<script src="https://mzoughi.github.io/mom/kirchoff-ex3-st4.js"></script>
<script src="https://mzoughi.github.io/mom/kirchoff-ex3-st5.js"></script>
<script>
  document.addEventListener('ctStageComplete', function(e){
    if (e.detail.thisq !== window.ctThisq) return;
    var nextId = ['ct2Root','ct3Root','ct4Root','ct5Root'][e.detail.stage-1];
    if (nextId) {
      var el = document.getElementById(nextId + window.ctThisq);
      if (el) {
        el.style.display = 'block';
        el.scrollIntoView({behavior:'smooth', block:'start'});
      }
    }
  });
</script>
<hr> <div>Complete just the first stage of the simulation tutorial (until you get just one resistor with the battery), then take a snapshot of the result, and paste it here:
  [AB0]
</div>

</body>
</html>
