<!-- ════════ SIMULATION ════════
Pattern: mirrors the VGG (Van de Graaff) example.
- var simObj = function() { ... rst(); return {...}; }
- var simObj1007 = new simObj();
- Animation: recursive window.setTimeout(runMotion, 40) guarded by runFlag
Physics: series circuit driven by v(t) = V0 sin(wt + phi), current i(t) = I0 sin(wt).
A removed component is replaced by a wire: R -> 0, XL -> 0, XC -> 0.
XL = wL, XC = 1/(wC), Z = sqrt(R^2 + (XL-XC)^2), I0 = V0/Z, tan(phi) = (XL-XC)/R
Phasors (CCW from +x): I and VR at wt, VL at wt+90deg, VC at wt-90deg, V at wt+phi.
Instantaneous value of each quantity = vertical projection of its phasor.
Animation time is in phase units (3 deg per frame); the real time t = wt/w is shown on screen.
-->
<script>
var lrcGen = function() {
var canvas = document.getElementById('lrcCanvas1007');
var ctx    = canvas.getContext('2d');
var W = canvas.width, H = canvas.height;   /* 640 x 460 */
var timer, runFlag = 0;
var CFG = (typeof lrcConfig1007 !== 'undefined') ? lrcConfig1007 : {};
/* ── color helper ── */
function c(prop, def) { return lrcA11y1007.col(prop, def); }
/* ── physics state ── */
var V0 = 10;                               /* source amplitude, volts */
var has = { R:true, L:true, C:true };      /* components present */
var showCur = true;                        /* current display toggle */
var R, L, Cap, f, w, XL, XC, Z, I0, phi, VR, VL, VC, f0, Iref, singular;
var vScale, iScale;
var theta = 0;                             /* wt, radians */
var DTH = 3*Math.PI/180, STEPANG = 15*Math.PI/180;
var frameCount = 0, narrationEvery = 120;  /* one narration per full turn */
var lastRegime = '';
/* ── layout (fixed) ── */
var BW = 330, BH = 118;
var LX0 = 30, LX1 = 310, LY0 = 24, LY1 = 98;
var OX = 160, OY = 295, RMAX = 116;
var GX0 = 322, GX1 = 630, GW = GX1 - GX0, GT = 170, GB = 420;
var CYC = 4*Math.PI;
var SHOW_IDS = { VR:'lrcShowVR1007', VL:'lrcShowVL1007', VC:'lrcShowVC1007', V:'lrcShowV1007' };
var INC_IDS  = { R:'lrcIncR1007', L:'lrcIncL1007', C:'lrcIncC1007' };
var SLD_IDS  = { R:'lrcR1007', L:'lrcL1007', C:'lrcC1007' };
var SHOWFOR  = { R:'VR', L:'VL', C:'VC' };
var NAMES    = { R:'resistor', L:'inductor', C:'capacitor' };
function deg(a){ return a*180/Math.PI; }
function sgn(v,d){ return (v >= 0 ? '+' : '\u2212') + Math.abs(v).toFixed(d); }
/* current with an automatic unit (A, mA, uA) chosen from the amplitude ref,
so the readout doesn't jump between units as i(t) passes through zero */
function fmtI(x, ref, signed){
var a=Math.abs(ref), m, u, d;
if (a>=1){ m=1; u=' A'; d=3; } else if (a>=1e-3){ m=1e3; u=' mA'; d=2; } else { m=1e6; u=' \u00B5A'; d=1; }
return (signed ? sgn(x*m,d) : (x*m).toFixed(d)) + u;
}
/* resistance / reactance with kilo-ohms above 1000 */
function fmtOhm(x, d){ return x>=1000 ? (x/1000).toFixed(3)+' k\u03A9' : x.toFixed(d===undefined?2:d)+' \u03A9'; }
function fmtCap(c){ var u=c*1e6; return (u%1===0 ? u.toFixed(0) : u.toFixed(1))+' \u00B5F'; }
/* fewer decimals for big values so the board labels stay short */
function sgnV(v){ var a=Math.abs(v); return sgn(v, a>=1000?0:(a>=100?1:2)); }
function shown(k){ if (k==='I') return showCur; var e = document.getElementById(SHOW_IDS[k]); return e ? e.checked : true; }
function tipToTail(){ var e = document.getElementById('lrcTT1007'); return e ? e.checked : false; }
function nVolt(){ return (has.R?1:0)+(has.L?1:0)+(has.C?1:0); }
function circuitName(){
if (nVolt()===3) return 'Series LRC Circuit';
if (nVolt()===1) return has.R ? 'Purely Resistive Circuit' : (has.L ? 'Purely Inductive Circuit' : 'Purely Capacitive Circuit');
return 'Series ' + (has.R?'R':'') + (has.L?'L':'') + (has.C?'C':'') + ' Circuit';
}
function readInputs(){
var e;
for (var k in INC_IDS){ e = document.getElementById(INC_IDS[k]); if (e) has[k] = e.checked; }
e = document.getElementById('lrcR1007'); R   = e ? parseFloat(e.value) : 50;
e = document.getElementById('lrcL1007'); L   = (e ? parseFloat(e.value) : 200) / 1000;
e = document.getElementById('lrcC1007'); Cap = (e ? parseFloat(e.value) : 20) * 1e-6;
e = document.getElementById('lrcF1007'); f   = e ? parseFloat(e.value) : 60;
}
function compute(){
w   = 2*Math.PI*f;
var Rv = has.R ? R : 0;
XL  = has.L ? w*L : 0;
XC  = has.C ? 1/(w*Cap) : 0;
Z   = Math.sqrt(Rv*Rv + (XL-XC)*(XL-XC));
singular = Z < 0.05;                     /* ideal LC exactly at resonance */
I0  = V0/Math.max(Z, 0.05);
phi = singular ? 0 : Math.atan2(XL-XC, Rv);
VR  = I0*Rv; VL = I0*XL; VC = I0*XC;
f0  = (has.L && has.C) ? 1/(2*Math.PI*Math.sqrt(L*Cap)) : NaN;
/* current reference: with R the max (resonant) current V0/R, otherwise the present current */
Iref = has.R ? V0/R : I0;
var m = Math.max(V0, VR, VL, VC, Math.sqrt(VR*VR + VL*VL));
vScale = RMAX/m;
iScale = 0.85*RMAX/Iref;
}
function regime(){
var d = deg(phi);
if (singular) return { k:'res', s:'Ideal LC at resonance: Z \u2192 0, current grows without limit' };
if (!has.L && !has.C) return { k:'res', s:'Purely resistive: V and I are in phase' };
if (has.L && has.C && Math.abs(d) < 0.5) return { k:'res', s:'At resonance (XL \u2248 XC): V and I are in phase' };
var both = has.L && has.C, pure = Math.abs(Math.abs(d)-90) < 0.05;
if (d > 0) return { k:'ind', s:(pure?'Purely inductive':(both?'Inductive (XL > XC)':'Inductive'))+': V leads I by '+d.toFixed(1)+'\u00B0' };
return { k:'cap', s:(pure?'Purely capacitive':(both?'Capacitive (XC > XL)':'Capacitive'))+': V lags I by '+(-d).toFixed(1)+'\u00B0' };
}
function quantities(){
var Q = [{ k:'V', m:V0*vScale, amp:V0, off:phi, col:c('--lrc-v','#6a1b9a'), lab:'V', sub:'', lw:4, dash:[] }];
if (has.R) Q.push({ k:'VR', m:VR*vScale, amp:VR, off:0,          col:c('--lrc-vr','#d32f2f'), lab:'V', sub:'R', lw:2.5, dash:[] });
if (has.L) Q.push({ k:'VL', m:VL*vScale, amp:VL, off:Math.PI/2,  col:c('--lrc-vl','#1565c0'), lab:'V', sub:'L', lw:2.5, dash:[] });
if (has.C) Q.push({ k:'VC', m:VC*vScale, amp:VC, off:-Math.PI/2, col:c('--lrc-vc','#2e7d32'), lab:'V', sub:'C', lw:2.5, dash:[] });
if (showCur) Q.push({ k:'I', m:Math.min(RMAX, I0*iScale), amp:I0, off:0, col:c('--lrc-i','#ef6c00'), lab:'I', sub:'', lw:2.5, dash:[7,4] });
return Q;
}
/* ── keep the controls in step with the circuit ── */
function syncControls(){
for (var k in has){
var sl = document.getElementById(SLD_IDS[k]); if (sl) sl.disabled = !has[k];
var sh = document.getElementById(SHOW_IDS[SHOWFOR[k]]); if (sh) sh.disabled = !has[k];
}
var t = document.getElementById('lrcTitle1007'); if (t) t.textContent = 'Phasor Diagram: ' + circuitName();
var rb = document.getElementById('lrcResBtn1007'); if (rb) rb.disabled = !(has.L && has.C);
var cb = document.getElementById('lrcCurBtn1007');
if (cb){ cb.value = 'Current: ' + (showCur ? 'ON' : 'OFF'); cb.setAttribute('aria-pressed', showCur ? 'true' : 'false'); }
}
/* ══════════ low-level canvas helpers ══════════ */
function arrow(x0,y0,x1,y1,col,lw,dash){
var dx=x1-x0, dy=y1-y0, len=Math.sqrt(dx*dx+dy*dy);
ctx.save(); ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=lw; ctx.lineCap='round';
if (len < 1.5){ ctx.beginPath(); ctx.arc(x0,y0,2.5,0,2*Math.PI); ctx.fill(); ctx.restore(); return; }
var ux=dx/len, uy=dy/len, hl=Math.min(12, len*0.45), hw=hl*0.5;
var bx=x1-ux*hl, by=y1-uy*hl;
ctx.setLineDash(dash||[]);
ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(bx,by); ctx.stroke();
ctx.setLineDash([]);
ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(bx-uy*hw,by+ux*hw); ctx.lineTo(bx+uy*hw,by-ux*hw); ctx.closePath(); ctx.fill();
ctx.restore();
}
function label(x,y,main,sub,col){
ctx.save(); ctx.textBaseline='middle'; ctx.textAlign='left';
ctx.font='bold 14px sans-serif'; var mw=ctx.measureText(main).width, sw=0;
if (sub){ ctx.font='bold 10px sans-serif'; sw=ctx.measureText(sub).width; }
var tx = x-(mw+sw)/2;
ctx.lineWidth=3; ctx.strokeStyle=c('--lrc-bg','#ffffff'); ctx.fillStyle=col;
ctx.font='bold 14px sans-serif'; ctx.strokeText(main,tx,y); ctx.fillText(main,tx,y);
if (sub){ ctx.font='bold 10px sans-serif'; ctx.strokeText(sub,tx+mw,y+5); ctx.fillText(sub,tx+mw,y+5); }
ctx.restore();
}
/* centred text with a subscript, e.g. v_R = +1.23 V (uses current fillStyle) */
function subText(x,y,main,sub,rest){
ctx.save(); ctx.textAlign='left'; ctx.textBaseline='middle';
ctx.font='11px monospace'; var a=ctx.measureText(main).width, cc=ctx.measureText(rest).width;

function roundRect(x,y,w,h,r){

/* ══════════ artistic props: circuit board ══════════ */
function perim(s){
var a=LX1-LX0, b=LY1-LY0, P=2*(a+b);
s=((s%P)+P)%P;
if (s<a) return [LX0+s, LY0]; s-=a;
if (s<b) return [LX1, LY0+s]; s-=b;
if (s<a) return [LX1-s, LY1]; s-=a;
return [LX0, LY1-s];
}
function resistorBands(){
/* 5-band code: three digits, multiplier (gold = x0.1), brown 1% tolerance. Covers 50 ohm to 10 kohm */
var CODE=['#000000','#8b4513','#e00000','#ff8c00','#ffd700','#008000','#0000ff','#8a2be2','#808080','#ffffff'];
var m=Math.floor(Math.log10(R)+1e-9)-2, digits=Math.round(R/Math.pow(10,m));
if (digits>=1000){ m++; digits=Math.round(digits/10); }
var d=String(digits);
return [CODE[+d[0]], CODE[+d[1]], CODE[+d[2]], m<0 ? '#c9a227' : CODE[m]];
}

/* ══════════ phasor diagram ══════════ */
function phasorGeometry(Q){
var vec={}, starts={}, k;
for (k=0; k<Q.length; k++){
var q=Q[k]; vec[q.k]=[q.m*Math.cos(theta+q.off), q.m*Math.sin(theta+q.off)];
starts[q.k]=[0,0];
}
if (tipToTail()){
var acc=[0,0], order=['VR','VL','VC'];
for (k=0; k<order.length; k++){
var key=order[k]; if (!vec[key]) continue;
starts[key]=[acc[0],acc[1]];
acc=[acc[0]+vec[key][0], acc[1]+vec[key][1]];
}
}
return { vec:vec, starts:starts };
}

ctx.setLineDash([]); ctx.strokeStyle=axis;

ctx.restore();

var am=theta+phi/2;

else if (onOrigin){ lx=v[0]+ux*14; ly=v[1]+uy*14; }

function curve(q,xEnd){

/* ── narration ── */
function sceneNarration(){
var r=regime(), tt=tipToTail(), parts=[];
var msg='The phasors rotate counterclockwise; \u03C9t is now '+(deg(theta)%360).toFixed(0)+' degrees. ';
msg+=r.s+'. ';
if (has.R) parts.push('VR = '+VR.toFixed(2)+' V, in phase with the current');
if (has.L) parts.push('VL = '+VL.toFixed(2)+' V, 90 degrees ahead of the current');
if (has.C) parts.push('VC = '+VC.toFixed(2)+' V, 90 degrees behind the current');
msg+='Phasor lengths: '+parts.join('; ')+'. ';
if (nVolt()>1){
if (tt) msg+='In tip-to-tail mode the component phasors are placed head to tail, and the chain ends exactly at the tip of the source phasor V. ';
if (has.L && has.C && !tt) msg+='VL and VC point in opposite directions, so they partly cancel. ';
var sum=VR+VL+VC;
if (sum > V0*1.01) msg+='Notice that the component amplitudes add to '+sum.toFixed(2)+' V, more than the source amplitude of '+V0+' V: they add as vectors, not as numbers. ';
}
msg+='Source voltage now: v = '+sgn(V0*Math.sin(theta+phi),2)+' V. ';
if (showCur) msg+='Current now: i = '+(singular?'unbounded':fmtI(I0*Math.sin(theta),I0,true))+'.';
else msg+='The current display is off.';
lrcA11y1007.narrate(msg);
}

var msg=prefix+circuitName()+': '+comp.join(', ')+', f = '+f+' Hz. ';
if (has.L) msg+='XL = '+fmtOhm(XL,1)+'. ';
if (has.C) msg+='XC = '+fmtOhm(XC,1)+'. ';
msg+= singular ? 'Impedance is zero, so the current has no limit. ' : 'Impedance Z = '+fmtOhm(Z,1)+', current amplitude '+fmtI(I0,I0,false)+'. ';
msg+=r.s+'.';

lrcA11y1007.narrate(msg);

/* ── one physics step ── */
function physicsStep(){
theta += DTH;
frameCount++;
var r=regime();
if (r.k!==lastRegime){ lastRegime=r.k; sceneNarration(); return; }
if (frameCount % narrationEvery === 0) sceneNarration();
}
function runMotion(){
physicsStep();
drawFrame();
if (runFlag === 1) timer = window.setTimeout(runMotion, 40);
}
