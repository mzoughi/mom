<title>Unit Conversion Calculator</title>

:root{
--bg:#f5f7fa;
--card:#ffffff;
--border:#d7dce2;
--ink:#1c242c;
--muted:#5c6b78;
--accent:#005a9c;
--accent-dark:#00426f;
--brass:#b8862f;
--brass-dark:#93691f;
--brass-tint:#fbf1de;
--error:#a3241c;
--error-tint:#fdecea;
--radius:10px;
}
*{ box-sizing:border-box; }
html,body{
margin:0;
padding:0;
background:var(--bg);
color:var(--ink);
font-family:'Inter', 'Segoe UI', Arial, sans-serif;
font-size:15px;
}
.page{
max-width:640px;
margin:0 auto;
padding:28px 18px 56px;
}
.card{
background:var(--card);
border:1px solid var(--border);
border-radius:var(--radius);
overflow:hidden;
}
header.app-header{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:12px;
padding:22px 24px 18px;
border-bottom:3px solid var(--brass);
}
header.app-header h1{
font-family:'Spectral', serif;
font-weight:600;
font-size:26px;
color:var(--accent-dark);
margin:0 0 6px;
letter-spacing:-0.01em;
}
header.app-header p{
margin:0;
color:var(--muted);
font-size:13.5px;
line-height:1.5;
max-width:44ch;
}
#fsBtn{
flex-shrink:0;
width:34px;
height:34px;
border-radius:8px;
border:1px solid var(--border);
background:var(--bg);
color:var(--muted);
font-size:16px;
cursor:pointer;
line-height:1;
}
#fsBtn:hover{ color:var(--accent); border-color:var(--accent); }
.body{
padding:22px 24px 26px;
}
.field{
margin-bottom:16px;
}
.field label{
display:block;
font-size:12px;
font-weight:600;
color:var(--muted);
text-transform:uppercase;
letter-spacing:0.04em;
margin-bottom:6px;
}
select, input[type="number"]{
width:100%;
font-family:'Inter', sans-serif;
font-size:15px;
padding:11px 12px;
border:1px solid var(--border);
border-radius:8px;
background:#fff;
color:var(--ink);
}
select:focus, input:focus{
outline:2px solid var(--accent);
outline-offset:1px;
}
.unit-row{
display:grid;
grid-template-columns:1fr auto 1fr;
gap:10px;
align-items:end;
}
.swap-btn{
width:40px;
height:40px;
border-radius:50%;
border:1px solid var(--border);
background:var(--bg);
color:var(--accent);
font-size:16px;
cursor:pointer;
align-self:center;
margin-top:20px;
}
.swap-btn:hover{ background:var(--accent); color:#fff; border-color:var(--accent); }
@media (max-width:460px){
.unit-row{ grid-template-columns:1fr; }
.swap-btn{ justify-self:center; margin-top:0; transform:rotate(90deg); }
}
.calc-btn{
width:100%;
padding:13px;
margin-top:4px;
background:var(--brass);
color:#231a08;
font-family:'Inter', sans-serif;
font-weight:600;
font-size:15px;
border:none;
border-radius:8px;
cursor:pointer;
}
.calc-btn:hover{ background:var(--brass-dark); }
.result{
margin-top:20px;
padding:18px 20px;
background:var(--brass-tint);
border:1px solid #ecd9ab;
border-radius:8px;
display:none;
}
.result.show{ display:block; }
.result .eq{
font-family:'IBM Plex Mono', monospace;
font-size:20px;
font-weight:600;
color:var(--accent-dark);
word-break:break-word;
}
.result .cat-note{
margin-top:4px;
font-size:12px;
color:var(--muted);
}
.error-box{
margin-top:20px;
padding:14px 16px;
background:var(--error-tint);
border:1px solid #f2c6c1;
border-radius:8px;
color:var(--error);
font-size:13.5px;
display:none;
}
.error-box.show{ display:block; }
.toggle-work{
margin-top:14px;
display:none;
}
.toggle-work.show{ display:block; }
.toggle-work a{
font-size:13px;
color:var(--accent);
text-decoration:none;
cursor:pointer;
font-weight:500;
}
.toggle-work a:hover{ text-decoration:underline; }
.work-panel{
margin-top:10px;
padding:14px 16px 14px 18px;
border-left:3px solid var(--brass);
background:#fafbfc;
border-radius:0 6px 6px 0;
}
.step{
font-family:'IBM Plex Mono', monospace;
font-size:13px;
line-height:1.7;
color:var(--ink);
}
.step + .step{ margin-top:8px; }
.step-label{
display:block;
font-family:'Inter', sans-serif;
font-size:11px;
font-weight:600;
color:var(--muted);
text-transform:uppercase;
letter-spacing:0.04em;
margin-bottom:2px;
}
.step.result-step{
padding-top:8px;
margin-top:10px;
border-top:1px dashed var(--border);
color:var(--accent-dark);
font-weight:600;
}
footer.app-footer{
padding:14px 24px 18px;
border-top:1px solid var(--border);
font-size:12px;
color:var(--muted);
background:var(--bg);
}
</style>
</head>
<body>
<div class="page">
<div class="card">
<header class="app-header">
<div>
<h1>Unit Conversion Calculator</h1>
<p>Pick a quantity, choose your units, and convert — with the math shown step by step.</p>
</div>
<button id="fsBtn" title="Full screen" onclick="toggleFullscreen()">⛶</button>
</header>
<div class="body">
<div class="field">
<label for="mtopic">Quantity</label>
<select id="mtopic" onchange="onCategoryChange()">
<option value="" selected disabled>Select a quantity…</option>
</select>
</div>
<div class="field">
<label for="variable">Value to convert</label>
<input type="number" id="variable" placeholder="e.g. 12.5" onkeydown="if(event.key==='Enter'){event.preventDefault();doConvert();}">
</div>
<div class="unit-row">
<div class="field" style="margin-bottom:0;">
<label for="unitInput">From</label>
<select id="unitInput"></select>
</div>
<button class="swap-btn" title="Swap units" onclick="swapUnits()">⇄</button>
<div class="field" style="margin-bottom:0;">
<label for="unitOutput">To</label>
<select id="unitOutput"></select>
</div>
</div>
<button class="calc-btn" onclick="doConvert()">Calculate</button>
<div class="result" id="resultBox">
<div class="eq" id="resultEq"></div>
<div class="cat-note" id="resultNote"></div>
</div>
<div class="error-box" id="errorBox"></div>
<div class="toggle-work" id="toggleWork">
<a id="workLink" href="#" onclick="toggleWorkPanel(); return false;">Show the math ▸</a>
<div class="work-panel" id="workPanel" style="display:none;"></div>
</div>
</div>
<footer class="app-footer">© Taha Mzoughi 2015</footer>
</div>
</div>

// ---- Significant figures ----------------------------------------------------
// Counts sig figs the conventional way: leading zeros never count; trailing
// zeros only count when there's an explicit decimal point.
function countSigFigs(str){
str = String(str).trim();
if (str === '' || isNaN(str)) return 1;
if (str[0] === '-' || str[0] === '+') str = str.slice(1);
let mantissa = str.split(/[eE]/)[0];
if (mantissa.indexOf('.') !== -1){
const [intPart, fracPart] = mantissa.split('.');
let digits = (intPart + fracPart).replace(/^0+/, '');
return digits.length || 1;
}
let digits = mantissa.replace(/^0+/, '').replace(/0+$/, '');
return digits.length || 1;
}
function formatSigFigs(num, sig){
if (!isFinite(num)) return String(num);
if (sig < 1) sig = 1;
if (num === 0) return sig > 1 ? (0).toFixed(sig - 1) : '0';
return num.toPrecision(sig);
}
// Floating-point arithmetic can leave noise like 31.999999999999943 where the
// true value is 32. Rounding to 12 significant figures clears that noise
// while still preserving far more precision than any sig-fig display needs.
function cleanFloat(num){
if (!isFinite(num) || num === 0) return num;
return parseFloat(num.toPrecision(12));
}
function trimNumber(num, maxSig){
maxSig = maxSig || 6;
if (num === 0) return '0';
const p = parseFloat(num.toPrecision(maxSig));
return p.toString();
}

// ---- Conversion logic ---------------------------------------------------
function doConvert(){
const catName = document.getElementById('mtopic').value;
if (!catName || !CATEGORIES[catName]){
showError('Please choose a quantity first.');
return;
}
const raw = document.getElementById('variable').value.trim();
if (raw === '' || isNaN(raw)){
showError('Enter a numeric value to convert.');
return;
}
const value = parseFloat(raw);
const units = CATEGORIES[catName];
const inIdx = parseInt(document.getElementById('unitInput').value, 10);
const outIdx = parseInt(document.getElementById('unitOutput').value, 10);
const inputUnit = units[inIdx];
const outputUnit = units[outIdx];
const sig = countSigFigs(raw);
if (catName === 'Temperature'){
convertTemperature(value, raw, inputUnit, outputUnit, sig);
} else {
convertLinear(value, raw, inputUnit, outputUnit, sig);
}
}
function convertLinear(value, raw, inputUnit, outputUnit, sig){
const factor = outputUnit.value / inputUnit.value;
const result = cleanFloat(value * factor);
const rounded = formatSigFigs(result, sig);
const fShown = trimNumber(factor, 6);
showResult(
`${raw} ${inputUnit.text} = ${rounded} ${outputUnit.text}`,
`Rounded to ${sig} significant figure${sig === 1 ? '' : 's'}, matching the precision of your input.`,
`
<div class="step"><span class="step-label">Conversion factor</span>1 ${inputUnit.text} = ${fShown} ${outputUnit.text}</div>
<div class="step"><span class="step-label">Set up</span>${raw} ${inputUnit.text} \u00D7 (${fShown} ${outputUnit.text} / 1 ${inputUnit.text}) = ${trimNumber(result, 10)} ${outputUnit.text}</div>
<div class="step"><span class="step-label">Significant figures</span>${raw} has ${sig} significant figure${sig === 1 ? '' : 's'}, so the answer is reported to ${sig}.</div>
<div class="step result-step"><span class="step-label">Answer</span>${raw} ${inputUnit.text} = ${rounded} ${outputUnit.text}</div>
`
);
}
function toKelvin(value, id){
if (id === 'C') return { k: value + 273.15, formula:`K = ${value} + 273.15` };
if (id === 'F') return { k: (value + 459.67) * 5 / 9, formula:`K = (${value} + 459.67) \u00D7 5/9` };
return { k: value, formula:`K = ${value}` };
}
function fromKelvin(k, id){
if (id === 'C') return { v: k - 273.15, formula:`\u00B0C = K \u2212 273.15` };
if (id === 'F') return { v: k * 9 / 5 - 459.67, formula:`\u00B0F = K \u00D7 9/5 \u2212 459.67` };
return { v: k, formula:`K = K` };
}
function convertTemperature(value, raw, inputUnit, outputUnit, sig){
const step1 = toKelvin(value, inputUnit.id);
step1.k = cleanFloat(step1.k);
if (step1.k < 0){
showError('That temperature is below absolute zero. Please enter a valid value and try again.');
return;
}
const step2 = fromKelvin(step1.k, outputUnit.id);
step2.v = cleanFloat(step2.v);
const rounded = formatSigFigs(step2.v, sig);
showResult(
`${raw} ${inputUnit.text} = ${rounded} ${outputUnit.text}`,
`Rounded to ${sig} significant figure${sig === 1 ? '' : 's'}, matching the precision of your input.`,
`
<div class="step"><span class="step-label">Step 1 — convert to Kelvin</span>${step1.formula} = ${trimNumber(step1.k, 8)} K</div>
<div class="step"><span class="step-label">Step 2 — convert to target unit</span>${step2.formula} = ${trimNumber(step2.v, 8)} ${outputUnit.text}</div>
<div class="step"><span class="step-label">Significant figures</span>${raw} has ${sig} significant figure${sig === 1 ? '' : 's'}, so the answer is reported to ${sig}.</div>
<div class="step result-step"><span class="step-label">Answer</span>${raw} ${inputUnit.text} = ${rounded} ${outputUnit.text}</div>
`
);
}
