<!-- ════════ Simulation ════════ -->
<script>
var flSim0922 = (function(){
var canvas = document.getElementById('flCv0922');
var ctx    = canvas.getContext('2d');
/* ── Physics constants ── */
var V_SOUND = 345;  /* m/s speed of sound in warm air */
var L0 = V_SOUND / (2 * 261.6); /* full tube length for C4 ≈ 0.660 m */
/* ── Note data ── */
/* holes: [H1,H2,H3,H4,H5,H6], 0=closed 1=open, left→right along tube */
/* hole positions as fraction of L0 from left (cork) end */
var HOLE_POS = [0.49, 0.55, 0.61, 0.67, 0.73, 0.79];
var NOTES = {
C4: { freq: 261.6, holes: [0,0,0,0,0,0], label: 'C4 (middle C)', octave: 4 },
D4: { freq: 293.7, holes: [0,0,0,0,0,1], label: 'D4',            octave: 4 },
E4: { freq: 329.6, holes: [0,0,0,0,1,1], label: 'E4',            octave: 4 },
F4: { freq: 349.2, holes: [0,0,0,1,0,1], label: 'F4',            octave: 4 },
G4: { freq: 392.0, holes: [0,0,0,1,1,1], label: 'G4',            octave: 4 },
A4: { freq: 440.0, holes: [0,0,1,1,1,1], label: 'A4 (concert A)', octave: 4 },
B4: { freq: 493.9, holes: [0,1,1,1,1,1], label: 'B4',            octave: 4 },
C5: { freq: 523.3, holes: [1,1,1,1,1,1], label: 'C5 (overblown)', octave: 5 },
D5: { freq: 587.3, holes: [0,1,1,1,1,1], label: 'D5 (overblown)', octave: 5 }
};
var NOTE_ORDER = ['C4','D4','E4','F4','G4','A4','B4','C5','D5'];
/* ── State ── */
var noteKey  = 'C4';
var dispMode = 'disp';  /* 'disp' | 'pres' */
var harmonic = 1;
var showMols = false;
var slowMode = false;
var index    = -1, time = 0.0;
var timer, runFlag = 1;
/* Derived */
function getNote()  { return NOTES[noteKey]; }
function getLeff()  { return V_SOUND / (2 * getNote().freq); } /* effective length for n=1 */
function getFreq()  { return getNote().freq * harmonic; }
function getLambda(){ return V_SOUND / getFreq(); }
/* ── Canvas layout ── */
/* Flute drawing zone */
var FY   = 95;   /* centreline y of flute tube */
var FH   = 36;   /* tube half-height (±18px from centre) */
var FX0  = 55;   /* x of left (cork) end */
var FX1  = 765;  /* x of right (open) end */
var FW   = FX1 - FX0;  /* total tube pixel width = 710 */
/* Graph zone */
var GX0  = 30;   /* left edge of graph x-axis */
var GY   = 360;  /* y centre / x-axis */
var GH   = 110;  /* half-height of graph area */
var AMPL = 85;   /* wave amplitude in graph pixels */
var MOL_R = 3;
/* Convert tube metres to canvas x in FLUTE drawing */
function m2px(metres) { return FX0 + metres / L0 * FW; }
/* Convert normalised position (0=left, 1=right of effective length) to graph x */
function norm2gx(n) {
var Leff = getLeff();
var embX = m2px(L0 * 0.024); /* embouchure ~17mm from cork */
var effEnd = m2px(Leff);
return embX + n * (effEnd - embX);
}
/* ── Molecule state ── */
var molecules = [];
var _seed = 42;
function _rng() { _seed=(_seed*1664525+1013904223)&0x7fffffff; return _seed/0x7fffffff; }
function _presAmp(n) { /* pressure spatial amplitude at normalised position n, open-open */
return Math.abs(Math.sin(harmonic * Math.PI * n));
}
function _initMols() {
_seed = 42; molecules = [];
var N_COLS = 55, n_min = 1, n_max = 10;
var ty = FY - FH + 3, by = FY + FH - 3, inner = by - ty;
var Leff = getLeff();
var embX = m2px(L0 * 0.024);
var effEnd = m2px(Leff);
var tubeW = effEnd - embX;
for (var col = 0; col < N_COLS; col++) {
var n_norm = (col + 0.5) / N_COLS;
var pAmp   = _presAmp(n_norm);
var n_col  = Math.round(n_min + (n_max - n_min) * pAmp);
var px     = embX + n_norm * tubeW;
var hues   = [0,15,30,50,70,95,130,160,185,210,235,260,285,310,335];
for (var m = 0; m < n_col; m++) {
var py = ty + Math.round(_rng() * inner);
var h  = hues[(col*3 + m*7) % hues.length];
molecules.push({ x_eq: px, y_eq: py, col: 'hsl('+h+',78%,38%)' });
}
}
}
function _molDisp(px) {
/* horizontal displacement of molecule at canvas x px */
var Leff = getLeff();
var embX = m2px(L0 * 0.024);
var effEnd = m2px(Leff);
var n_norm = (px - embX) / (effEnd - embX);
if (n_norm < 0 || n_norm > 1) return 0;
/* open-open: displacement = cos(n*pi*n_norm) */
var cosT = Math.cos(2 * Math.PI * getFreq() * time);
return (FW / N_COLS_PX) * Math.cos(harmonic * Math.PI * n_norm) * cosT;
}
var N_COLS_PX = 1; /* pixel scale for mol displacement -- set in draw */
/* ── HC colour helpers ── */
function cBg()   { return flA11y0922.isHC() ? '#0d0d0d' : '#f8f4e8'; }
function cAx()   { return flA11y0922.isHC() ? '#cccccc' : '#333333'; }
function cGrid() { return flA11y0922.isHC() ? '#2a3344' : '#c8c8b8'; }
function cTxt()  { return flA11y0922.isHC() ? '#eeeeee' : '#222222'; }
function cTit()  { return flA11y0922.isHC() ? '#bbaaff' : '#4400aa'; }
function cWave() { return dispMode==='pres'
? (flA11y0922.isHC() ? '#ffaa44' : '#b86000')
: (flA11y0922.isHC() ? '#cc77cc' : '#660066'); }
function cTube() { return flA11y0922.isHC() ? '#6688bb' : '#4466aa'; }
function cTubeFill(){ return flA11y0922.isHC() ? 'rgba(80,120,180,0.12)' : 'rgba(200,230,255,0.45)'; }
function cEffFill() { return flA11y0922.isHC() ? 'rgba(80,160,80,0.15)'  : 'rgba(180,255,180,0.30)'; }
function cHoleOpen(){ return flA11y0922.isHC() ? '#222' : '#f0f0f0'; }
function cHoleClosed(){ return flA11y0922.isHC() ? '#667799' : '#336699'; }
function cEmb()  { return flA11y0922.isHC() ? '#ffdd88' : '#cc8800'; }
/* ── Arrow (Fendt) ── */
function arrow(x1,y1,x2,y2,w,col,txt,spc) {
if (!w) w=1; if (!txt) txt=""; if (!spc) spc=5;
if (!col) col=ctx.strokeStyle;
ctx.fillStyle=col; ctx.strokeStyle=col;
var dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy);
if (len===0) return;
dx/=len; dy/=len;
var s=2.5*w+7.5, xSp=x2-s*dx, ySp=y2-s*dy;
var h=0.5*w+3.5, xSp1=xSp-h*dy, ySp1=ySp+h*dx, xSp2=xSp+h*dy, ySp2=ySp-h*dx;
xSp=x2-0.6*s*dx; ySp=y2-0.6*s*dy;
ctx.beginPath(); ctx.lineWidth=w; ctx.moveTo(x1,y1);
if (len<5) ctx.lineTo(x2,y2); else ctx.lineTo(xSp,ySp);
ctx.stroke();
if (len<5) return;
ctx.beginPath(); ctx.fillStyle=ctx.strokeStyle;
ctx.moveTo(xSp,ySp); ctx.lineTo(xSp1,ySp1); ctx.lineTo(x2,y2); ctx.lineTo(xSp2,ySp2);
ctx.closePath(); ctx.fill();
var tspc=(x2<=x1)?-(3*spc):2*spc;
ctx.fillText(txt, x2+tspc, y2+spc);
}
/* ── Draw the flute body ── */
function drawFlute() {
var note = getNote();
var Leff = getLeff();
var embPx = m2px(L0 * 0.024); /* embouchure ~17mm from cork ≈ 2.4% of L0 */
var effEnd = m2px(Leff);
var ty = FY - FH, by = FY + FH;
/* Full tube fill */
ctx.fillStyle = cTubeFill();
ctx.fillRect(FX0, ty, FW, FH*2);
/* Effective length highlight (green tint) */
ctx.fillStyle = cEffFill();
ctx.fillRect(embPx, ty, effEnd - embPx, FH*2);
/* Tube walls */
ctx.strokeStyle = cTube(); ctx.lineWidth = 3;
ctx.beginPath(); ctx.moveTo(FX0, ty); ctx.lineTo(FX1, ty); ctx.stroke();
ctx.beginPath(); ctx.moveTo(FX0, by); ctx.lineTo(FX1, by); ctx.stroke();
/* Left end: cork stopper */
ctx.strokeStyle = cTube(); ctx.lineWidth = 4;
ctx.beginPath(); ctx.moveTo(FX0, ty); ctx.lineTo(FX0, by); ctx.stroke();
/* Hatch marks for cork */
ctx.strokeStyle = cTube(); ctx.lineWidth = 1;
for (var yy = ty; yy <= by; yy += 7) {
ctx.beginPath(); ctx.moveTo(FX0-2, yy); ctx.lineTo(FX0-9, yy+7); ctx.stroke();
}
ctx.font = '10pt Calibri'; ctx.fillStyle = cTxt();
ctx.textAlign = 'center'; ctx.textBaseline = 'top';
ctx.fillText('cork', FX0, by+4);
/* Right end: open */
ctx.strokeStyle = flA11y0922.isHC() ? '#666' : '#aaa'; ctx.lineWidth = 1.5;
ctx.setLineDash([4,3]);
ctx.beginPath(); ctx.moveTo(FX1, ty-6); ctx.lineTo(FX1, by+6); ctx.stroke();
ctx.setLineDash([]);
ctx.fillText('open', FX1, by+4);
/* Embouchure hole (oval, top of tube) */
ctx.fillStyle = cEmb(); ctx.strokeStyle = cEmb(); ctx.lineWidth = 2;
ctx.beginPath();
ctx.ellipse(embPx, ty, 12, 7, 0, 0, 2*Math.PI);
ctx.fill();
ctx.font = '10pt Calibri'; ctx.fillStyle = cEmb();
ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
ctx.fillText('embouchure', embPx, ty-8);
/* Tone holes */
var holeR = 7;
for (var h = 0; h < 6; h++) {
var hx = m2px(HOLE_POS[h] * L0);
var open = note.holes[h] === 1;
/* Indicate open vs closed */
ctx.strokeStyle = cTube(); ctx.lineWidth = 2;
if (open) {
ctx.fillStyle = cHoleOpen();
} else {
ctx.fillStyle = cHoleClosed();
}
ctx.beginPath();
ctx.arc(hx, by + 14, holeR, 0, 2*Math.PI);
ctx.fill(); ctx.stroke();
/* Connector line from tube bottom to hole */
ctx.beginPath(); ctx.moveTo(hx, by); ctx.lineTo(hx, by+7); ctx.stroke();
/* Label */
ctx.font = '9pt Calibri'; ctx.fillStyle = cTxt();
ctx.textAlign = 'center'; ctx.textBaseline = 'top';
ctx.fillText('H'+(h+1), hx, by+23);
}
/* Effective length bracket + label */
var bry = by + 42;
ctx.strokeStyle = flA11y0922.isHC() ? '#88cc88' : '#226622';
ctx.lineWidth = 1.5;
ctx.beginPath(); ctx.moveTo(embPx, bry); ctx.lineTo(effEnd, bry); ctx.stroke();
ctx.beginPath(); ctx.moveTo(embPx, bry-4); ctx.lineTo(embPx, bry+4); ctx.stroke();
ctx.beginPath(); ctx.moveTo(effEnd, bry-4); ctx.lineTo(effEnd, bry+4); ctx.stroke();
ctx.font = '10pt Calibri'; ctx.fillStyle = flA11y0922.isHC() ? '#88cc88' : '#226622';
ctx.textAlign = 'center'; ctx.textBaseline = 'top';
ctx.fillText('L\u2091 = ' + Leff.toFixed(3) + ' m', (embPx+effEnd)/2, bry+3);
/* Standing wave drawn INSIDE the tube in the effective region */
_drawWaveInTube(embPx, effEnd, ty, by);
/* Molecules inside tube */
if (showMols) _drawMolsInTube();
}
/* ── Standing wave inside the flute tube ── */
function _drawWaveInTube(x0, x1, ty, by) {
var wvC = cWave();
var tubeAMPL = (FH - 4); /* px -- fits in tube */
ctx.strokeStyle = wvC; ctx.lineWidth = 2.5;
ctx.save();
/* Clip to tube interior */
ctx.beginPath(); ctx.rect(x0, ty+1, x1-x0, (by-ty)-2); ctx.clip();
ctx.beginPath();
var steps = 200;
for (var s = 0; s <= steps; s++) {
var n_norm = s / steps;
var px = x0 + n_norm * (x1 - x0);
var wv = _waveVal(n_norm) * tubeAMPL / AMPL;
var py = FY - wv;
if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
}
ctx.stroke();
ctx.restore();
}
/* ── Molecules inside flute tube ── */
function _drawMolsInTube() {
var Leff  = getLeff();
var embX  = m2px(L0 * 0.024);
var effEnd = m2px(Leff);
var tubeAMPL = (FH - 4);
N_COLS_PX = (effEnd - embX) / 55; /* pixel width per column */
for (var k = 0; k < molecules.length; k++) {
var mol = molecules[k];
/* Horizontal displacement in tube coords */
var n_norm = (mol.x_eq - embX) / (effEnd - embX);
if (n_norm < 0 || n_norm > 1) continue;
var cosT = Math.cos(2 * Math.PI * getFreq() * time);
var sp_disp = Math.cos(harmonic * Math.PI * n_norm); /* open-open displacement */
var disp_px = N_COLS_PX * sp_disp * cosT * 2.0; /* scale factor for visibility */
var mx = Math.max(embX + MOL_R, Math.min(effEnd - MOL_R, mol.x_eq + disp_px));

ctx.beginPath(); ctx.arc(mx, mol.y_eq, MOL_R, 0, 2*Math.PI); ctx.fill();

}
/* ── Wave value at normalised position n (open-open tube) ── */
function _waveVal(n_norm) {
var cosT = Math.cos(2 * Math.PI * getFreq() * time);
if (dispMode === 'disp') {
/* Displacement: cos(n*pi*x/L) -- antinodes at both ends */
return AMPL * Math.cos(harmonic * Math.PI * n_norm) * cosT;
} else {
/* Pressure: sin(n*pi*x/L) -- nodes at both ends */
return AMPL * Math.sin(harmonic * Math.PI * n_norm) * cosT;
}
}
/* ── Draw the graph panel ── */
function drawGraph() {
var Leff = getLeff();
var gxEnd = GX0 + Math.round(Leff / L0 * 580); /* scale to show proportional length */
var gxEnd = Math.min(GX0 + 580, GX0 + Math.round(Leff / L0 * 620));
var gW    = gxEnd - GX0;

/* Panel background */

ctx.fillRect(GX0, GY - GH, gW, GH*2);
/* Grid lines */
ctx.strokeStyle = grdC; ctx.lineWidth = 0.8;
for (var i = 0; i <= harmonic*2; i++) {
var gx = GX0 + Math.round(i * gW / (harmonic*2));
ctx.beginPath(); ctx.moveTo(gx, GY-GH); ctx.lineTo(gx, GY+GH); ctx.stroke();
}
for (var j = -1; j <= 1; j++) {
var gy = GY + j * GH * 0.75;
ctx.beginPath(); ctx.moveTo(GX0-8, gy); ctx.lineTo(gxEnd, gy); ctx.stroke();
}
/* Axes using Fendt arrow */

var yLabel = dispMode === 'disp' ? 'y (mm)' : 'p (Pa)';
arrow(GX0-2, GY, gxEnd+30, GY, 2, axC, 'x (m)', -12);
arrow(GX0,   GY+2, GX0, GY-GH-18, 2, axC, yLabel, -9);
/* Wave curve */
ctx.strokeStyle = wvC; ctx.lineWidth = 2.5;
ctx.beginPath();
for (var s = 0; s <= 300; s++) {
var n = s / 300;
var gx2 = GX0 + n * gW;
var wv  = _waveVal(n);
if (s===0) ctx.moveTo(gx2, GY-wv); else ctx.lineTo(gx2, GY-wv);
}
ctx.stroke();
/* Node / antinode markers */
ctx.font = 'bold 11pt Calibri'; ctx.textBaseline = 'top';
for (var k = 0; k <= harmonic; k++) {
var n = k / harmonic;
var gxk = GX0 + n * gW;
var isDispNode = false; /* open-open: k=0,harmonic are antinodes for disp */
/* displacement nodes are at k+0.5 half-positions; antinodes at k positions */
/* pressure antinodes at k+0.5, nodes at k */
var isNode = (dispMode==='disp') ? false : true; /* at k positions: disp=antinode, pres=node */
var lbl = isNode ? 'N' : 'A';
ctx.fillStyle  = isNode ? (flA11y0922.isHC() ? '#88ddff' : '#0044aa')
: (flA11y0922.isHC() ? '#ffaa66' : '#aa2200');
ctx.textAlign = 'center';
ctx.fillText(lbl, gxk, GY+5);
ctx.strokeStyle = axC; ctx.lineWidth = 1;
ctx.beginPath(); ctx.moveTo(gxk, GY-4); ctx.lineTo(gxk, GY+4); ctx.stroke();
}
/* Also mark midpoints */
for (var k = 0; k < harmonic; k++) {
var n = (k + 0.5) / harmonic;
var gxk = GX0 + n * gW;
var isNode = (dispMode==='disp') ? true : false;
var lbl = isNode ? 'N' : 'A';
ctx.fillStyle = isNode ? (flA11y0922.isHC() ? '#88ddff' : '#0044aa')
: (flA11y0922.isHC() ? '#ffaa66' : '#aa2200');
ctx.textAlign = 'center'; ctx.textBaseline = 'top';
ctx.fillText(lbl, gxk, GY+5);
ctx.strokeStyle = axC; ctx.lineWidth = 1;
ctx.beginPath(); ctx.moveTo(gxk, GY-4); ctx.lineTo(gxk, GY+4); ctx.stroke();
}
/* x-axis labels (0 to Leff in metres) */
ctx.font = '11pt Calibri'; ctx.fillStyle = txtC;
ctx.textAlign = 'center'; ctx.textBaseline = 'top';
for (var k = 0; k <= harmonic; k++) {
var n = k / harmonic;
var gxk = GX0 + n * gW;
ctx.fillText((n * Leff).toFixed(3), gxk, GY + GH - 14);
}
/* Graph title */
ctx.font = 'bold 13pt Calibri'; ctx.fillStyle = titC; ctx.textAlign = 'center';
ctx.textBaseline = 'bottom';
var modeStr = dispMode === 'disp' ? 'Air displacement' : 'Pressure variation';
ctx.fillText(modeStr + '  --  ' + noteKey + '  (n = ' + harmonic + ', f = ' + getFreq().toFixed(1) + ' Hz)', GX0 + gW/2, GY - GH - 4);
}
/* ── Info panel ── */
function drawInfo() {
var note  = getNote();
var Leff  = getLeff();
var lam   = getLambda();
var f     = getFreq();
var txtC  = cTxt(), titC = cTit();

/* ── Main draw ── */
function drawMotion() {
if (index >= 8000) { runFlag = 0; document.getElementById('flPlay0922').textContent = '\u25B6'; }
if (runFlag !== 1) return;

index++;

function setMode(mode) {

function setHarmonic(n) {

: 'Molecules hidden.');

/* Boot */

flA11y0922.narrate(
