<!-- ════════ SIMULATION ════════
Pattern: mirrors the VGG / Doppler / Shock-Waves / Ripple-Tank / Reflection-Refraction examples.
- var simObj = function() { ... rst(); return { pl, ps, step, rst, setLength }; }
- var simObj0922 = new simObj();
- Animation: recursive window.setTimeout(runMotion, trate) guarded by runFlag; here it also drives real
audio via the Web Audio API (started/stopped by pl()/ps(), frequency updated live as length changes).
Original build. Physics: a reed acts acoustically like a CLOSED end (pressure antinode / displacement node);
the open end is a displacement antinode. That makes the straw a quarter-wave resonator:
f = v_sound / (4 * L)
with v_sound = 34300 cm/s. This is the same relationship that governs the classic "cut the straw shorter to
raise the pitch" reed demo. The on-canvas standing-wave line shows the displacement mode shape
u(x,t) = A * sin(pi*x / (2L)) * cos(omega t) -- node at the reed, antinode at the open end -- exaggerated in
height for visibility, not drawn to physical scale.
-->
<script>
var st1Gen = function() {
var canvas = document.getElementById('st1Canvas0922');
var ctx    = canvas.getContext('2d');
var W = canvas.width, H = canvas.height;   /* 800 x 260 */
var readoutEl = document.getElementById('st1Readout0922');
var timer, runFlag = 0;
function c(prop, def) { return st1A11y0922.col(prop, def); }
var V_SOUND = 34300; /* cm/s */
var PX_PER_CM = 26, X0 = 110, MIDY = 110, TUBE_H = 46;
var length = 11, freq = 0, t = 0, dt = 0.04, trate = 40;
var frameCount = 0, narrationEvery = 50;
var NOTE_NAMES = ['C','C\u266f','D','D\u266f','E','F','F\u266f','G','G\u266f','A','A\u266f','B'];
function el(id){ return document.getElementById(id); }
function noteName(f){
if (!(f>0) || !isFinite(f)) return '--';
var midi = Math.round(69+12*Math.log2(f/440));
var name = NOTE_NAMES[((midi%12)+12)%12];
var octave = Math.floor(midi/12)-1;
return name+octave;
}
function recompute(){
freq = V_SOUND/(4*length);
updateReadout();
updateAudioFrequency();
}
function updateReadout(){
if (!readoutEl) return;
var lam = V_SOUND/freq;
readoutEl.textContent = 'Length: '+length.toFixed(1)+' cm | Frequency \u2248 '+freq.toFixed(0)+
' Hz | Note \u2248 '+noteName(freq)+' | \u03bb \u2248 '+lam.toFixed(1)+' cm';
}
/* ══════════ Web Audio ══════════ */
var audioCtx, oscNode, filterNode, gainNode;
function ensureAudio(){
if (audioCtx) return;
try{
window.AudioContext = window.AudioContext || window.webkitAudioContext;
audioCtx = new AudioContext();
} catch(e){ /* Web Audio unsupported */ }
}
function startTone(){
ensureAudio(); if (!audioCtx) return;
if (audioCtx.state==='suspended'){ try{ audioCtx.resume(); }catch(e){} }
stopTone();
oscNode = audioCtx.createOscillator();
oscNode.type = 'sawtooth';
oscNode.frequency.setValueAtTime(freq, audioCtx.currentTime);
filterNode = audioCtx.createBiquadFilter();
filterNode.type = 'lowpass';
filterNode.frequency.setValueAtTime(2400, audioCtx.currentTime);
gainNode = audioCtx.createGain();
gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
gainNode.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime+0.03);
oscNode.connect(filterNode); filterNode.connect(gainNode); gainNode.connect(audioCtx.destination);
try{ oscNode.start(); }catch(e){}
}
function updateAudioFrequency(){
if (oscNode && audioCtx){ try{ oscNode.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.02); }catch(e){} }
}
function stopTone(){
if (gainNode && audioCtx){
try{
gainNode.gain.cancelScheduledValues(audioCtx.currentTime);
gainNode.gain.setValueAtTime(gainNode.gain.value, audioCtx.currentTime);
gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime+0.05);
}catch(e){}
}
if (oscNode){ var o=oscNode; oscNode=null; try{ setTimeout(function(){ try{o.stop();}catch(e){} }, 80); }catch(e){} }
}
/* ══════════ drawing ══════════ */
function lengthPx(){ return length*PX_PER_CM; }
function drawStraw(){
var Lpx = lengthPx();
var top = MIDY-TUBE_H/2, bot = MIDY+TUBE_H/2;
var grad = ctx.createLinearGradient(0,top,0,bot);
grad.addColorStop(0, c('--st1-tube-dark','#a8a190'));
grad.addColorStop(0.5, c('--st1-tube','#d8d2c4'));
grad.addColorStop(1, c('--st1-tube-dark','#a8a190'));
ctx.fillStyle = grad;
ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
roundRect(X0, top, Lpx, TUBE_H, 6);
ctx.fill(); ctx.stroke();
/* open end cap (ellipse suggesting a tube opening) */
ctx.beginPath(); ctx.ellipse(X0+Lpx, MIDY, 6, TUBE_H/2, 0, 0, 2*Math.PI);
ctx.fillStyle = c('--st1-tube-dark','#a8a190'); ctx.fill(); ctx.stroke();
/* reed notch at mouth end */
ctx.fillStyle = c('--st1-reed','#e8c468'); ctx.strokeStyle='#333'; ctx.lineWidth=1.5;
ctx.beginPath();
ctx.moveTo(X0, top); ctx.lineTo(X0-16, top-14); ctx.lineTo(X0+6, top+6); ctx.closePath();
ctx.fill(); ctx.stroke();
ctx.beginPath();
ctx.moveTo(X0, bot); ctx.lineTo(X0-16, bot+14); ctx.lineTo(X0+6, bot-6); ctx.closePath();
ctx.fill(); ctx.stroke();
}
function roundRect(x,y,w,h,r){
ctx.beginPath();
ctx.moveTo(x+r,y);
ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
ctx.closePath();
}
function drawStandingWave(){
var Lpx = lengthPx();
var amp = Math.min(38, TUBE_H*0.9);
var omega = 2*Math.PI*freq;
ctx.save();
ctx.strokeStyle = c('--st1-wave','#4fd1ff'); ctx.lineWidth = 2.5; ctx.globalAlpha=0.9;
ctx.beginPath();
var N=80;
for (var i=0;i<=N;i++){
var xf = i/N; var x = X0+xf*Lpx;
var y = MIDY - amp*Math.sin(Math.PI*xf/2)*Math.cos(omega*t);
if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
}
ctx.stroke();
ctx.restore();
}
function drawRuler(){
ctx.strokeStyle = c('--st1-text','#111'); ctx.fillStyle = c('--st1-text','#111');
ctx.lineWidth = 1; ctx.font = '11px Calibri'; ctx.textAlign='center';
var y0 = MIDY+TUBE_H/2+18;
ctx.beginPath(); ctx.moveTo(X0,y0); ctx.lineTo(X0+20*PX_PER_CM,y0); ctx.stroke();
for (var cm=0; cm<=20; cm+=2){
var x = X0+cm*PX_PER_CM;
ctx.beginPath(); ctx.moveTo(x,y0-4); ctx.lineTo(x,y0+4); ctx.stroke();
ctx.fillText(String(cm), x, y0+16);
}
}
function drawBreath(){
if (runFlag!==1) return;
var phase = (t*4)%1;
ctx.save();
ctx.strokeStyle = c('--st1-text','#111'); ctx.globalAlpha = 0.5; ctx.lineWidth=1.5;
for (var i=0;i<2;i++){
var r = 4+ (phase+i*0.5)%1 * 14;
ctx.beginPath(); ctx.arc(X0-24, MIDY, r, -0.6, 0.6); ctx.stroke();
}
ctx.restore();
}
function drawFrame(){
ctx.clearRect(0,0,W,H);
drawStraw();
drawStandingWave();
drawRuler();
drawBreath();
}
/* ══════════ narration ══════════ */
function sceneNarration(){
st1A11y0922.narrate('Length '+length.toFixed(1)+' cm. Frequency about '+freq.toFixed(0)+' Hz, note '+
noteName(freq)+'. '+(runFlag===1?'Sounding now.':'Paused.'));
}
/* ══════════ public controls ══════════ */
function setLength(v){
length = Math.max(0.5, parseFloat(v)||11);
var l=el('st1LenVal0922'); if(l) l.textContent = length.toFixed(1);
recompute();
drawFrame();
}
/* ══════════ animation loop ══════════ */
function runMotion(){
t += dt;
drawFrame();
frameCount++;
if (frameCount % narrationEvery === 0){ sceneNarration(); }
if (runFlag===1){ timer = window.setTimeout(runMotion, trate); }
}
function pl(){ window.clearTimeout(timer); runFlag = 1; startTone(); runMotion(); sceneNarration(); }
function ps(){ window.clearTimeout(timer); runFlag = 0; stopTone(); drawFrame(); sceneNarration(); }
function step(){ window.clearTimeout(timer); runFlag = 0; t += dt; drawFrame(); }
function rst(){
window.clearTimeout(timer); runFlag = 0; stopTone();
length = 11; t = 0; frameCount = 0;
var lEl=el('st1Len0922'); if(lEl) lEl.value = length;
var lLbl=el('st1LenVal0922'); if(lLbl) lLbl.textContent = length.toFixed(1);
var playBtn = el('st1Play0922'); if (playBtn) playBtn.value='Play';
recompute();
drawFrame();
st1A11y0922.narrate('Ready. Straw length 11.0 cm. Press Play to hear it, or drag the length slider.');
}
/* boot */
rst();
return { pl:pl, ps:ps, step:step, rst:rst, setLength:setLength };
};
var st1Sim0922 = new st1Gen();
</script>
<script>
st1A11y0922.init();
</script>
